name: TEMP Trainer AI C2e-f book checkpoint

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  checkpoint-project-book:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SECTION_B64: >-
        
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 0

      - name: Append checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64, os; from pathlib import Path; p=Path("docs/project_book/TRAINER_AI.md"); marker="### 26.13 C2e-f"; text=p.read_text(encoding="utf-8"); assert marker not in text, "section 26.13 already present"; section=base64.b64decode(os.environ["SECTION_B64"]).decode("utf-8"); p.write_text(text.rstrip()+"\n\n---\n\n"+section+"\n", encoding="utf-8")'
          git rm .github/workflows/trainer-ai-c2ef-book-checkpoint-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md
          git commit -m 'docs(trainer-ai): record C2e-f support formula selection'
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
