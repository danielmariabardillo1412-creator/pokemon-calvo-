name: Temporary Trainer AI C3f-ak Variant Fix

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-ak-variant-fix
    paths:
      - .github/workflows/trainer-ai-c3f-ak-variant-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-ak-variant-fix

      - name: Apply explicit Variant annotation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/var submitted_dict := substitution_report.get("submitted_action", null)/var submitted_dict: Variant = substitution_report.get("submitted_action", null)/' modules/gameplay/trainer_battle_session.gd
          grep -F 'var submitted_dict: Variant = substitution_report.get("submitted_action", null)' modules/gameplay/trainer_battle_session.gd
          rm .github/workflows/trainer-ai-c3f-ak-variant-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gameplay/trainer_battle_session.gd .github/workflows/trainer-ai-c3f-ak-variant-fix.yml
          git commit -m 'fix(trainer-ai): type C3f-ak submitted proposal variant explicitly'
          git push origin HEAD:tmp/trainer-ai-c3f-ak-variant-fix
