name: Temporary Trainer AI C3f-ak Audit Variant Fix

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-ak-audit-variant-fix
    paths:
      - .github/workflows/trainer-ai-c3f-ak-audit-variant-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-ak-audit-variant-fix

      - name: Type C3f-ak audit Variant values explicitly and self-clean
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/var submitted := substitution.get("submitted_action", null)/var submitted: Variant = substitution.get("submitted_action", null)/' tests/trainer_ai/trainer_battle_session_authoritative_substitution_audit_test_suite.gd
          sed -i 's/var proposal_action := proposal.get("proposal_action", null)/var proposal_action: Variant = proposal.get("proposal_action", null)/' tests/trainer_ai/trainer_battle_session_authoritative_substitution_audit_test_suite.gd
          grep -F 'var submitted: Variant = substitution.get("submitted_action", null)' tests/trainer_ai/trainer_battle_session_authoritative_substitution_audit_test_suite.gd
          grep -F 'var proposal_action: Variant = proposal.get("proposal_action", null)' tests/trainer_ai/trainer_battle_session_authoritative_substitution_audit_test_suite.gd
          rm .github/workflows/trainer-ai-c3f-ak-audit-variant-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/trainer_ai/trainer_battle_session_authoritative_substitution_audit_test_suite.gd .github/workflows/trainer-ai-c3f-ak-audit-variant-fix.yml
          git commit -m 'fix(trainer-ai): type C3f-ak audit variants explicitly'
          git push origin HEAD:tmp/trainer-ai-c3f-ak-audit-variant-fix
