name: CAMP004 W04 - CI evolucion formas y revision
on:
  push:
    branches:
      - codex/calvo-items-20261103-w04-camp004
    paths:
      - '.github/workflows/parallel-camp004-w04-autoci.yml'
      - 'tests/tools/test_parallel_items_w04_campaign_004_manifest.py'
      - 'tests/tools/test_parallel_items_w04_campaign_004.py'
      - 'tests/gameplay/parallel_items_w04_campaign_004.gd'
      - 'modules/**' # Reparacion propia y verificable
      - 'tests/fixtures/parallel_items/w04_campaign_004.json'
      - 'docs/coordination/items_parallel_v1/reports/W04/CAMP_004_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/W04/CAMP_004_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp004-w04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Alcance exclusivo IA4 y progreso
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_004_manifest.py
          N=$(python -B tests/tools/test_parallel_items_w04_campaign_004_manifest.py --count-only)
          echo "blocks=$N" >> "$GITHUB_OUTPUT"
      - name: Bootstrap (sin pruebas funcionales)
        if: steps.scope.outputs.blocks == '0'
        run: echo "BOOTSTRAP_W04_NO_FUNCIONAL 0/10"
      - uses: chickensoft-games/setup-godot@v2.4.1
        if: steps.scope.outputs.blocks != '0'
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Preparar Godot y fixtures
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04c004-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04c004-import.log; then exit 1; fi
      - name: 'Python: contratos reales acumulativos'
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/tools/test_parallel_items_w04_campaign_004.py
          python -B tests/tools/test_parallel_items_w04_campaign_004.py --ci 2>&1 | tee w04c004-python.log
          python -B tests/tools/test_parallel_items_w04_campaign_004_manifest.py --verify-output PY --log w04c004-python.log
      - name: 'Godot: contratos reales y negativos por familia'
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/gameplay/parallel_items_w04_campaign_004.gd
          timeout 480s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_004.gd 2>&1 | tee w04c004-godot.log
          python -B tests/tools/test_parallel_items_w04_campaign_004_manifest.py --verify-output GODOT --log w04c004-godot.log
      - name: Regresion CAMP003 W04 (30 IDs auditados)
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_003.py --ci 2>&1 | tee w04c004-regresion-camp003-py.log
          grep -E '^CAMP003_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04c004-regresion-camp003-py.log
          timeout 480s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_003.gd 2>&1 | tee w04c004-regresion-camp003-gd.log
          grep -E '^CAMP003_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04c004-regresion-camp003-gd.log
      - name: Regresion SaveV2 de las seis piedras anteriores
        if: steps.scope.outputs.blocks == '5' || steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s python -B tests/tools/test_parallel_items_w04_campaign_001.py --godot godot --timeout 210 2>&1 | tee w04c004-regresion.log
          grep -E 'PARALLEL_ITEMS_W04_CAMP_001_GODOT PASS iteration=3' w04c004-regresion.log
      - name: Conservar registros siete dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp004-w04-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w04c004-*.log
