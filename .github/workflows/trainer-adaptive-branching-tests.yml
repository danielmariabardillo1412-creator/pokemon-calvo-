name: Trainer Adaptive Branching Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainer-adaptive-branching-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FASE 28 adaptive branching gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee trainer-adaptive-branching-godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Stage pinned PokeAPI report fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee trainer-adaptive-branching-import.log

      - name: Run FASE 28 adaptive branching suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://tests/trainer_adaptive_branching_test_runner.gd 2>&1 | tee trainer-adaptive-branching-test.log
          summary="$(grep -E '=== TRAINER ADAPTIVE BRANCHING RESULT: [0-9]+ PASS / 0 FAIL ===' trainer-adaptive-branching-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 52 ]; then
            echo "Adaptive branching regression: expected at least 52 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "FASE 28 adaptive branching gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run adaptive candidate on FASE 26 corpus
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://tests/trainer_adaptive_branching_corpus_test_runner.gd 2>&1 | tee trainer-adaptive-corpus-test.log
          summary="$(grep -E '=== TRAINER ADAPTIVE CORPUS RESULT: [0-9]+ PASS / 0 FAIL ===' trainer-adaptive-corpus-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 36 ]; then
            echo "Adaptive planner corpus regression: expected at least 36 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "FASE 28 adaptive candidate preserves FASE 26 corpus: $pass_count PASS / 0 FAIL"

      - name: Upload adaptive branching logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-adaptive-branching-logs-${{ github.run_id }}
          path: |
            trainer-adaptive-branching-godot-version.log
            trainer-adaptive-branching-import.log
            trainer-adaptive-branching-test.log
            trainer-adaptive-corpus-test.log
          if-no-files-found: ignore
          retention-days: 7
