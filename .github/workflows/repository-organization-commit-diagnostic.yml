name: Repository Organization Commit Diagnostic

on:
  push:
    branches:
      - chore/repository-organization-v1
    paths:
      - '.github/workflows/repository-organization-commit-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-organization-v1
          fetch-depth: 0

      - name: Apply migration and capture git diagnostics
        shell: bash
        run: |
          set +e
          python tools/repository_organize_tmp.py > /tmp/migrate.out 2>&1
          migrate_rc=$?
          {
            echo '=== MIGRATION ==='
            cat /tmp/migrate.out
            echo "migrate_rc=$migrate_rc"
            echo
            echo '=== HEAD BEFORE ==='
            git rev-parse HEAD
            echo
            echo '=== STATUS ==='
            git status --short
            echo
            echo '=== WORKFLOW DIFF ==='
            git diff --name-status -- .github/workflows
            echo
            echo '=== ALL CHANGED PATHS ==='
            git diff --name-status
            echo
            echo '=== ADD ==='
          } > repository_commit_diag_tmp.txt

          git add -A >>repository_commit_diag_tmp.txt 2>&1
          add_rc=$?
          echo "add_rc=$add_rc" >>repository_commit_diag_tmp.txt
          echo >>repository_commit_diag_tmp.txt
          echo '=== CACHED WORKFLOW DIFF ===' >>repository_commit_diag_tmp.txt
          git diff --cached --name-status -- .github/workflows >>repository_commit_diag_tmp.txt 2>&1

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo >>repository_commit_diag_tmp.txt
          echo '=== COMMIT ATTEMPT ===' >>repository_commit_diag_tmp.txt
          git commit -m 'chore(repo): organize fixtures docs and legacy tooling' >>repository_commit_diag_tmp.txt 2>&1
          commit_rc=$?
          echo "commit_rc=$commit_rc" >>repository_commit_diag_tmp.txt

          if [ "$commit_rc" -eq 0 ]; then
            echo "migration_sha=$(git rev-parse HEAD)" >>repository_commit_diag_tmp.txt
            echo >>repository_commit_diag_tmp.txt
            echo '=== PUSH DRY RUN ===' >>repository_commit_diag_tmp.txt
            git push --dry-run origin HEAD:chore/repository-organization-v1 >>repository_commit_diag_tmp.txt 2>&1
            echo "push_dry_run_rc=$?" >>repository_commit_diag_tmp.txt
          fi
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: repository-organization-commit-diagnostic-${{ github.run_id }}
          path: repository_commit_diag_tmp.txt
          if-no-files-found: error
          retention-days: 1
