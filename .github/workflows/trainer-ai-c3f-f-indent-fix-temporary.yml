name: TEMP Trainer AI C3f-f indentation fix

on:
  push:
    branches:
      - audit/trainer-ai-c3f-f-consumer-contract-audit-staging

permissions:
  contents: write

jobs:
  fix-c3f-f-indent:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'trigger C3f-f indentation fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3f-f-consumer-contract-audit-staging
      - name: Fix loop indentation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/trainer_ai/trainer_roster_component_first_consumer_contract_audit_test_suite.gd')
          text = path.read_text(encoding='utf-8')
          old = '''\t\tseen_ids[instance_id] = true
          \t\tvar operational := state.get("operational", {}) as Dictionary
          \t\tif not bool(operational.get("available", false)):
          \t\t\tmissing_operational_join_cases += 1
          \t\tvar structural := state.get("structural", {}) as Dictionary
          \t\tif String(state.get("availability_state", "")) == "surviving" and not bool(structural.get("available", false)):
          \t\t\tmissing_structural_survivor_join_cases += 1
          \t\tif (
          \t\t\tbool(structural.get("available", false))
          \t\t\tand String(structural.get("species_id", "")) != String(state.get("species_id", ""))
          \t\t):
          \t\t\tspecies_identity_mismatches += 1
          \t\tif String(operational.get("species_id", "")) != String(state.get("species_id", "")):
          \t\t\tspecies_identity_mismatches += 1
          \t\tif sampled_species_examples.size() < 12:
          \t\t\tsampled_species_examples.append(String(state.get("species_id", "")))
          \t\tif String(state.get("availability_state", "")) == "surviving":
          \t\t\tsurviving_vectors.append(_immediate_value_vector(state))
          '''
          new = '''\t\t\tseen_ids[instance_id] = true
          \t\t\tvar operational := state.get("operational", {}) as Dictionary
          \t\t\tif not bool(operational.get("available", false)):
          \t\t\t\tmissing_operational_join_cases += 1
          \t\t\tvar structural := state.get("structural", {}) as Dictionary
          \t\t\tif String(state.get("availability_state", "")) == "surviving" and not bool(structural.get("available", false)):
          \t\t\t\tmissing_structural_survivor_join_cases += 1
          \t\t\tif (
          \t\t\t\tbool(structural.get("available", false))
          \t\t\t\tand String(structural.get("species_id", "")) != String(state.get("species_id", ""))
          \t\t\t):
          \t\t\t\tspecies_identity_mismatches += 1
          \t\t\tif String(operational.get("species_id", "")) != String(state.get("species_id", "")):
          \t\t\t\tspecies_identity_mismatches += 1
          \t\t\tif sampled_species_examples.size() < 12:
          \t\t\t\tsampled_species_examples.append(String(state.get("species_id", "")))
          \t\t\tif String(state.get("availability_state", "")) == "surviving":
          \t\t\t\tsurviving_vectors.append(_immediate_value_vector(state))
          '''
          if old not in text:
              raise SystemExit('expected C3f-f indentation block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/trainer-ai-c3f-f-indent-fix-temporary.yml
          rm .audit/trainer_ai_c3f_f_indent_fix_trigger.marker
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/trainer_ai/trainer_roster_component_first_consumer_contract_audit_test_suite.gd .github/workflows/trainer-ai-c3f-f-indent-fix-temporary.yml .audit/trainer_ai_c3f_f_indent_fix_trigger.marker
          git diff --cached --check
          git commit -m 'test(trainer-ai): fix C3f-f member-loop indentation'
          git push origin HEAD:audit/trainer-ai-c3f-f-consumer-contract-audit-staging
