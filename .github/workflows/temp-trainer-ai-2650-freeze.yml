name: TEMP Append Trainer AI 26.50

on:
  push:
    branches:
      - temp/trainer-ai-2650-freeze

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/trainer-ai-2650-freeze
          fetch-depth: 0
      - name: Append 26.50 literally and verify once
        shell: bash
        run: |
          set -euo pipefail
          cat .github/temp/trainer_ai_2650_append.md >> docs/project_book/TRAINER_AI.md
          count="$(grep -c '^### 26\.50)' docs/project_book/TRAINER_AI.md || true)"
          test "$count" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md
          git commit -m 'temp: append Trainer AI 26.50'
          git push origin HEAD:temp/trainer-ai-2650-freeze
