name: DATA V3 Refresh Legacy Regression Fixtures V2

on:
  pull_request:
    paths:
      - '.github/workflows/data-v3-refresh-legacy-tests-v2.yml'
      - 'tools/data_v3_migrate_legacy.py'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feature/data-foundation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout DATA V3 branch
        uses: actions/checkout@v4
        with:
          ref: feature/data-foundation-v3
          fetch-depth: 0

      - name: Migrate legacy assertions
        shell: bash
        run: |
          set -euo pipefail
          python tools/data_v3_migrate_legacy.py

      - name: Regenerate DATA V3 raw and reports
        shell: bash
        run: |
          set -euo pipefail
          python tools/pokeapi_adapter_v3.py

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Normalize DATA V3
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import >/tmp/data-v3-migrate-v2-import.log 2>&1
          timeout 480s godot --headless --path . --script res://tools/run_import.gd 2>&1 | tee /tmp/data-v3-migrate-v2-normalize.log
          grep -F 'broken_references=0 rejected=0' /tmp/data-v3-migrate-v2-normalize.log

      - name: Refresh pinned reports
        shell: bash
        run: |
          set -euo pipefail
          cp data/reports/forms_policy_report.json ci/fixtures/pokeapi_reports/forms_policy_report.json
          cp data/reports/unsupported_mechanics.json ci/fixtures/pokeapi_reports/unsupported_mechanics.json
          cp data/reports/import_summary.json ci/fixtures/pokeapi_reports/import_summary.json

      - name: Smoke test migrated canonical project suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee /tmp/data-v3-migrate-v2-project.log
          grep -E '=== PROJECT TEST RESULT: [0-9]+ PASS / 0 FAIL ===' /tmp/data-v3-migrate-v2-project.log

      - name: Commit verified regression migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_runner.gd tests/progression_test_suite.gd \
            ci/fixtures/pokeapi_reports/forms_policy_report.json \
            ci/fixtures/pokeapi_reports/unsupported_mechanics.json \
            ci/fixtures/pokeapi_reports/import_summary.json
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'test(data-v3): align canonical regressions with snapshot policy'
          git push origin HEAD:feature/data-foundation-v3
