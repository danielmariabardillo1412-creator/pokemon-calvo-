name: Temporary Trainer AI C3f-ak staging

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-ak-stage
    paths:
      - .github/workflows/trainer-ai-c3f-ak-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-ak-stage

      - name: Wire authoritative side-b substitution and audit runner
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' ‌AP)),' | base64 --decode | python3
          rm .github/workflows/trainer-ai-c3f-ak-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gameplay/trainer_battle_session.gd tests/trainer_ai/trainer_evaluation_corpus_test_runner.gd .github/workflows/trainer-ai-c3f-ak-stage.yml
          git commit -m 'feat(trainer-ai): stage C3f-ak authoritative side-b substitution'
          git push origin HEAD:tmp/trainer-ai-c3f-ak-stage
