name: TEMP Trainer AI support production

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  apply-support-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PATCH_B64: >-
        
      TEST_B64: >-
        
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 0

      - name: Apply guarded support production tranche
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64, os; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          git rm .github/workflows/trainer-ai-support-production-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/trainer_ai/trainer_roster_role_inference.gd
          git add tests/trainer_ai/trainer_roster_control_evidence_test_suite.gd
          git add tests/trainer_ai/trainer_roster_support_guarded_reliability_test_suite.gd
          git add tests/trainer_ai/trainer_roster_support_production_test_suite.gd
          git add tests/trainer_ai/trainer_loadouts_test_runner.gd
          git diff --cached --check
          git commit -m 'feat(trainer-ai): recalibrate support with guarded reliability'
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
