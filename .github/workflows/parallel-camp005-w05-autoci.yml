name: CAMP005 W05 - bloque nuevo con regresion
on:
  push:
    branches:
      - codex/calvo-items-20261103-w05-camp005
    paths:
      - '.github/workflows/parallel-camp005-w05-autoci.yml'
      - 'tests/tools/test_parallel_items_w05_campaign_005_manifest.py'
      - 'tests/tools/test_parallel_items_w05_campaign_005.py'
      - 'tests/gameplay/parallel_items_w05_campaign_005.gd'
      - 'tests/fixtures/parallel_items/w05_campaign_005.json'
      - 'modules/**'
      - 'docs/coordination/items_parallel_v1/reports/W05/CAMP_005_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/W05/CAMP_005_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp005-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identidad, reserva y progreso CAMP005
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261103-w05-camp005"
          python -B tests/tools/test_parallel_items_w05_campaign_005_manifest.py
          N=$(python -B tests/tools/test_parallel_items_w05_campaign_005_manifest.py --count-only)
          echo "blocks=$N" >> "$GITHUB_OUTPUT"
      - name: Bootstrap 0 de 10, no funcional
        if: steps.scope.outputs.blocks == '0'
        run: echo "BOOTSTRAP_CAMP005_W05_NO_FUNCIONAL 0/10"

      - uses: chickensoft-games/setup-godot@v2.4.1
        if: steps.scope.outputs.blocks != '0'
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Preparar Godot 4.7 y fuentes canónicas
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp005-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp005-import.log; then exit 1; fi

      - name: Pruebas Python CAMP005 con recibo de bloque
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/tools/test_parallel_items_w05_campaign_005.py
          python -B tests/tools/test_parallel_items_w05_campaign_005.py --ci 2>&1 | tee camp005-python.log
          python -B tests/tools/test_parallel_items_w05_campaign_005_manifest.py --verify-output PY --log camp005-python.log
      - name: Pruebas Godot CAMP005 con recibo de bloque
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/gameplay/parallel_items_w05_campaign_005.gd
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_005.gd 2>&1 | tee camp005-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_005_manifest.py --verify-output GODOT --log camp005-godot.log
      - name: Detectar parche de producción propio
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -q '^modules/'; then
            echo "modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "modules=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regresión CAMP004 y CAMP003 en hitos y parches propios
        if: steps.scope.outputs.blocks == '5' || steps.scope.outputs.blocks == '10' || steps.changed.outputs.modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_campaign_004.py --ci 2>&1 | tee camp005-regression-camp004-py.log
          grep -E '^CAMP004_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp005-regression-camp004-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_004.gd 2>&1 | tee camp005-regression-camp004-godot.log
          grep -E '^CAMP004_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp005-regression-camp004-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_003.py --ci 2>&1 | tee camp005-regression-camp003-py.log
          grep -E '^CAMP003_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp005-regression-camp003-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_003.gd 2>&1 | tee camp005-regression-camp003-godot.log
          grep -E '^CAMP003_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp005-regression-camp003-godot.log
      - name: Conservar evidencia 7 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp005-w05-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: camp005-*.log
