name: TEMP Trainer AI C3f-c notebook append

on:
  push:
    branches:
      - audit/trainer-ai-c3f-c-doc-staging

permissions:
  contents: write

jobs:
  append-c3f-c-doc:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'docs(audit): trigger C3f-c notebook append'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3f-c-doc-staging
      - name: Append C3f-c checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/trainer_ai_c3f_c_readiness_decomposition_sensitivity.md >> docs/project_book/TRAINER_AI.md
          rm .audit/trainer_ai_c3f_c_readiness_decomposition_sensitivity.md
          rm .github/workflows/trainer-ai-c3f-c-doc-append-temporary.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md .audit/trainer_ai_c3f_c_readiness_decomposition_sensitivity.md .github/workflows/trainer-ai-c3f-c-doc-append-temporary.yml
          git diff --cached --check
          git commit -m 'docs(trainer-ai): record C3f-c readiness decomposition sensitivity'
          git push origin HEAD:audit/trainer-ai-c3f-c-doc-staging
