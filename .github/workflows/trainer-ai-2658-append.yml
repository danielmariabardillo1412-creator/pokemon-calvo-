name: Temporary Trainer AI freeze 26.58 append

on:
  push:
    branches:
      - tmp/trainer-ai-2658-append
    paths:
      - .github/workflows/trainer-ai-2658-append.yml

permissions:
  contents: write

jobs:
  append-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-2658-append

      - name: Append freeze and self-clean staging files
        shell: bash
        run: |
          set -euo pipefail
          test -f tmp/trainer_ai_2658_append.md
          if grep -q '^## 26\.58 —' docs/project_book/TRAINER_AI.md; then
            echo '26.58 already present; refusing duplicate append.' >&2
            exit 1
          fi
          cat tmp/trainer_ai_2658_append.md >> docs/project_book/TRAINER_AI.md
          rm tmp/trainer_ai_2658_append.md
          rm .github/workflows/trainer-ai-2658-append.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md tmp/trainer_ai_2658_append.md .github/workflows/trainer-ai-2658-append.yml
          git commit -m 'docs(trainer-ai): stage freeze C3f-aj as 26.58'
          git push origin HEAD:tmp/trainer-ai-2658-append
