name: IA6 W05 books selective integration candidate
on:
  push:
    branches:
      - codex/calvo-ia6-candidate-w05-books-20261111
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ia6-w05-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true
      - name: Import and check scripts
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee ia6-w05-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' ia6-w05-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1
      - name: Book localization and W03 Rope preservation
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_staging_v4.py | tee ia6-w05-policy.log
          grep -E '^W05_V4_SOURCE_ES PASS ids=229 exact_pokeapi=229 excluded_dynamax_candy=1 rope_unmodified=1$' ia6-w05-policy.log
          grep -E '^W05_V4_BAG_CONTRACT PASS panel=1 signals=1 double_spend_guard=1 stable_ids=1 callback_ui_only=1$' ia6-w05-policy.log
      - name: Real bag integration and old IA6 guards
        shell: bash
        run: |
          set -euo pipefail
          for script in ia6_books_bag_20261109 ia6_integration_mint_rope_20261109 w05_staging_v4_books_bag; do
            timeout 900s godot --headless --path . --script "res://tests/gameplay/${script}.gd" 2>&1 | tee "ia6-w05-${script}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|^IA6_.*FAIL|^W05_V4_.*FAIL' "ia6-w05-${script}.log"; then exit 1; fi
          done
          grep -E '^IA6_BOOK_BAG PASS checks=[1-9][0-9]* features=real_bag,w05_panel,one_teach,savev2$' ia6-w05-ia6_books_bag_20261109.log
          grep -E '^IA6_INTEGRATION PASS checks=[1-9][0-9]* features=mint_effective_nature,escape_rope_bag_savev2$' ia6-w05-ia6_integration_mint_rope_20261109.log
          grep -E '^W05_V4_REAL_FIELD_BAG PASS slots=4 es=229 one_panel=1 no_double_spend=1 stale=1 party_storage=1 savev2=1 no_autosave=1 rope_preserved=IA6_SMOKE checks=[1-9][0-9]*$' ia6-w05-w05_staging_v4_books_bag.log
      - name: W03 native Repel with books and Rope on same real demo
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repel_l3.gd 2>&1 | tee ia6-w05-w03-repel.log
          if grep -E 'SCRIPT ERROR|Parse Error|^CAMP006_W03_REPEL_L3 FAIL' ia6-w05-w03-repel.log; then exit 1; fi
          grep -E '^CAMP006_W03_REPEL_L3 PASS checks=[1-9][0-9]*        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia6-w05-candidate-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: ia6-w05-*.log
 ia6-w05-w03-repel.log
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia6-w05-candidate-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: ia6-w05-*.log
