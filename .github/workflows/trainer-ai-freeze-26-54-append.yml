name: Temporary Trainer AI freeze 26.54 append

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1
    paths:
      - .github/workflows/trainer-ai-freeze-26-54-append.yml

permissions:
  contents: write

jobs:
  append-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1

      - name: Append canonical freeze once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 26\.54 —' docs/project_book/TRAINER_AI.md; then
            echo '26.54 already present; refusing duplicate append.'
            exit 0
          fi
          printf '%s' '' | base64 --decode >> docs/project_book/TRAINER_AI.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md
          if git diff --cached --quiet; then
            echo 'No notebook change to commit.'
            exit 0
          fi
          git commit -m 'docs(trainer-ai): freeze C3f-af as 26.54'
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
