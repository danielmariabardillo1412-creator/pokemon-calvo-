`TrainerBattleSession` puede ejecutar `TrainerItemAwareSearch` en shadow sobre el lifecycle productivo real sin entregar memoria live mutable ni alterar la acción autoritativa existente.

El camino certificado usa:

- snapshots detached side-specific del owner dual;
