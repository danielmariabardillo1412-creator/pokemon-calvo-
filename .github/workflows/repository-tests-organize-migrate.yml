name: Repository Tests Organization Migration

on:
  push:
    branches:
      - chore/repository-organization-v1
    paths:
      - 'tools/repository_tests_organize_tmp.py'
      - '.github/workflows/repository-tests-organize-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-organization-v1
          fetch-depth: 0

      - name: Apply tests layout migration
        shell: bash
        run: |
          set -euo pipefail
          python tools/repository_tests_organize_tmp.py

      - name: Verify tests layout
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test_runner.gd
          test -f tests/battle/battle_v2_test_suite.gd
          test -f tests/data/data_foundation_v3_domain_test_runner.gd
          test -f tests/gameplay/progression_test_suite.gd
          test -f tests/trainer_ai/trainer_team_composition_test_runner.gd
          test "$(find tests -maxdepth 1 -type f -name '*.gd' -printf '%f\n')" = 'test_runner.gd'
          test "$(find tests -mindepth 2 -type f -name '*.gd' | wc -l)" -eq 85

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Stage pinned PokeAPI report fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json

      - name: Import reorganized project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/tests-org-import.log

      - name: Run global regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee /tmp/tests-org-global.log
          grep -E '=== PROJECT TEST RESULT: [0-9]+ PASS / 0 FAIL ===' /tmp/tests-org-global.log

      - name: Run every domain test runner
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r runner; do
            echo "=== RUNNER $runner ==="
            timeout 480s godot --headless --path . --script "res://$runner" 2>&1 | tee "/tmp/$(basename "$runner").log"
          done < <(find tests/battle tests/data tests/gameplay tests/trainer_ai -type f -name '*_test_runner.gd' | sort)

      - name: Commit verified tests organization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(tests): organize suites by domain'
          git push origin HEAD:chore/repository-organization-v1
