name: Temporary Trainer AI C3f-am type fix

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-am-typefix
    paths:
      - .github/workflows/trainer-ai-c3f-am-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-am-typefix

      - name: Apply exact Variant annotation and self-clean staging files
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/tmp_c3fam_typefix.py
          rm ci/tmp_c3fam_typefix.py
          rm .github/workflows/trainer-ai-c3f-am-typefix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gameplay/trainer_battle_session.gd ci/tmp_c3fam_typefix.py .github/workflows/trainer-ai-c3f-am-typefix.yml
          git commit -m 'fix(trainer-ai): type autonomous submitted action variant'
          git push origin HEAD:tmp/trainer-ai-c3f-am-typefix
