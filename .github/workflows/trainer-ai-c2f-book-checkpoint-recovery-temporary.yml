name: TEMP Trainer AI C2f book checkpoint recovery

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  checkpoint-project-book-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 0
      - name: Append staged checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("docs/project_book/TRAINER_AI.md"); s=Path("docs/project_book/_C2F_APPEND_TEMP.md").read_text(); t=p.read_text(); out=t if "### 26.15 C2f" in t else t.rstrip()+"\n\n"+s.strip(); p.write_text(out.rstrip()+"\n")'
          rm -f docs/project_book/_C2F_APPEND_TEMP.md
          rm -f .github/workflows/trainer-ai-c2f-book-checkpoint-temporary.yml
          rm -f .github/workflows/trainer-ai-c2f-book-checkpoint-recovery-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/project_book .github/workflows
          git diff --cached --check
          git commit -m "docs(trainer-ai): close C2f team analyzer integration"
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
