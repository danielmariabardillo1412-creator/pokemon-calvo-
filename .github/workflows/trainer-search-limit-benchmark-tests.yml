name: Trainer Search Limit Benchmark Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainer-search-limit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FASE 27 trainer search limit benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee trainer-search-limit-godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Stage pinned PokeAPI report fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee trainer-search-limit-import.log

      - name: Diagnose replanning controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://tests/trainer_search_limit_horizon_diagnostic.gd 2>&1 | tee trainer-search-limit-horizon-diagnostic.log

      - name: Run FASE 27 search limit benchmark suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://tests/trainer_search_limit_benchmark_test_runner.gd 2>&1 | tee trainer-search-limit-test.log
          summary="$(grep -E '=== TRAINER SEARCH LIMIT BENCHMARK RESULT: [0-9]+ PASS / 0 FAIL ===' trainer-search-limit-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 49 ]; then
            echo "Trainer search limit benchmark regression: expected at least 49 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "FASE 27 trainer search limit benchmark gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Upload trainer search limit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-search-limit-logs-${{ github.run_id }}
          path: |
            trainer-search-limit-godot-version.log
            trainer-search-limit-import.log
            trainer-search-limit-horizon-diagnostic.log
            trainer-search-limit-test.log
          if-no-files-found: ignore
          retention-days: 7
