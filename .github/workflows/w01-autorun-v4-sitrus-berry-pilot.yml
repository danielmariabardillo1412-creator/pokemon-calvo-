name: W01 TANDA04 Sitrus Berry isolated functional pilot
on:
  push:
    branches:
      - codex/calvo-items-20261110-w01-gems-autobatch01
    paths:
      - '.github/workflows/w01-autorun-v4-sitrus_berry-pilot.yml'
      - 'tests/tools/repro_w01_autorun_v4_sitrus_berry_native.cjs'
      - 'tests/gameplay/parallel_items_w01_autorun_v4_sitrus_berry.gd'
      - 'tests/tools/test_parallel_items_w01_autorun_v4_sitrus_berry.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w01-v4-sitrus_berry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v4_sitrus_berry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore canonical assets and native Showdown
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w01-v4-sitrus-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w01-v4-sitrus-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee w01-v4-sitrus-reference.log
      - name: Real Sitrus Berry damage lock switch reset SaveV2
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_autorun_v4_sitrus_berry.py | tee w01-v4-sitrus-python.log
          grep -E '^W01_V4_SITRUS_PY PASS row=10 checks=[1-9][0-9]*$' w01-v4-sitrus-python.log
          node tests/tools/repro_w01_autorun_v4_sitrus_berry_native.cjs 2>&1 | tee w01-v4-sitrus-native.log
          grep -F 'W01_V4_NATIVE PASS id=sitrus_berry modes=6 threshold=2 one_use=1 snapshots=6' w01-v4-sitrus-native.log
          timeout 460s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_autorun_v4_sitrus_berry.gd 2>&1 | tee w01-v4-sitrus-godot.log
          grep -E '^W01_V4_L3_ROW PASS row=10 id=sitrus_berry modes=6 checks=[1-9][0-9]*$' w01-v4-sitrus-godot.log
      - name: Upload pilot diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-v4-sitrus_berry-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w01-v4-sitrus-*.log
