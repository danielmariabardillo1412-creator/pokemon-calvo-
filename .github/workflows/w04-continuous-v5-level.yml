name: W04 V5 regional level evolution
on:
  push:
    branches: [codex/calvo-items-20261111-w04-regional-level-v5]
    paths:
      - '.github/workflows/w04-continuous-v5-level.yml'
      - 'modules/creatures/progression/evolution_system.gd'
      - 'modules/creatures/progression/regional_level_evolution_contract_w04_v5.gd'
      - 'tests/gameplay/w04_continuous_v5_level_up.gd'
      - 'tests/tools/test_w04_continuous_v5_level.py'
      - 'docs/coordination/items_parallel_v1/CONTINUOUS_V5/STATE_W04.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore and import Godot
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04-v5-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04-v5-import.log; then exit 1; fi
      - name: Python strict route inventory and excluded mechanics
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_w04_continuous_v5_level.py | tee w04-v5-python.log
          grep -E '^W04_V5_PY PASS routes=10 conditional=6 trade=1 special=4 regional=57$' w04-v5-python.log
      - name: Ten regional level-up routes native XP event and SaveV2
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w04_continuous_v5_level_up.gd 2>&1 | tee w04-v5-level.log
          grep -E '^W04_V5 PASS checks=[1-9][0-9]* routes=10 owners=20$' w04-v5-level.log
      - name: Regression V4 seven item routes plus W02 nature
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w04_continuous_v3_real_evolution.gd 2>&1 | tee w04-v5-item-regression.log
          grep -E '^W04_V3_L3 PASS checks=[1-9][0-9]* routes=7 ownership=14 rollback=2$' w04-v5-item-regression.log
      - name: Regression 55 of 56 regional encounters
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w04_autorun_v3_all_regional.gd 2>&1 | tee w04-v5-forms.log
          grep -E '^W04_AUTORUN_V3_ALL PASS checks=[1-9][0-9]* examined=56 native_functional=55 blocked=1$' w04-v5-forms.log
      - name: Regression V4 four normal regional abilities
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v4_ability.gd 2>&1 | tee w04-v5-abilities.log
          grep -E '^W04_AUTORUN_V4 PASS checks=[1-9][0-9]* promoted=4 blocked=1$' w04-v5-abilities.log
      - name: Veto dynamax_candy intact
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open('config/item_selection_v1.json', encoding='utf-8'))
          assert 'dynamax_candy' in data['excluded_ids']
          print('W04_V5_DYNAMAX_EXCLUSION PASS')
          PY
      - name: Preserve V5 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-v5-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w04-v5-*.log
