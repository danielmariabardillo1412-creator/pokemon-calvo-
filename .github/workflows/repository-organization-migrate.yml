name: Repository Organization Migration

on:
  push:
    branches:
      - chore/repository-organization-v1
    paths:
      - 'tools/repository_organize_tmp.py'
      - '.github/workflows/repository-organization-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-organization-v1
          fetch-depth: 0

      - name: Apply repository organization migration
        shell: bash
        run: |
          set -euo pipefail
          python tools/repository_organize_tmp.py

      - name: Verify old active resource paths are gone
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'res://data/(species|moves|types|statuses)/' -- tests modules scenes
          ! git grep -n -F 'res://data/battle/runtime_coverage_v2.json' -- tests modules scenes
          test -f data/fixtures/regression_resources/species/embercub.tres
          test -f data/fixtures/regression_resources/types/fire.tres
          test -f data/fixtures/regression_resources/battle/runtime_coverage_v2.json
          test -f docs/adr/ARCHITECTURE_DECISION_033_TRAINER_TEAM_COMPOSITION.md
          test -f docs/history/STATUS_PHASE_HISTORY.md
          test -f tools/archive/pokeapi_adapter_v2_legacy.py

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import reorganized project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/repo-org-import.log

      - name: Run canonical project regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee /tmp/repo-org-project.log
          grep -E '=== PROJECT TEST RESULT: [0-9]+ PASS / 0 FAIL ===' /tmp/repo-org-project.log

      - name: Run Spanish type resource regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://tests/spanish_types_foundation_test_runner.gd 2>&1 | tee /tmp/repo-org-types.log
          grep -E '=== SPANISH TYPES FOUNDATION RESULT: [0-9]+ PASS / 0 FAIL ===' /tmp/repo-org-types.log

      - name: Commit verified structural organization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No organization changes to commit.'
            exit 0
          fi
          git commit -m 'chore(repo): organize fixtures docs and legacy tooling'
          git push origin HEAD:chore/repository-organization-v1
