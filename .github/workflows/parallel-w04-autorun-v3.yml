name: W04 AUTORUN V3 - regional forms group01
on:
  push:
    branches:
      - codex/calvo-items-20261104-w04-camp006
    paths:
      - '.github/workflows/parallel-w04-autorun-v3.yml'
      - 'tests/gameplay/w04_autorun_v3_alola_group01.gd'
      - 'modules/creatures/progression/canonical_form_identity_w04.gd'
      - 'modules/creatures/progression/creature_factory.gd'
      - 'modules/save/save_game_data.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore source fixtures and import
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04-v3-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04-v3-import.log; then exit 1; fi
      - name: Alola six actual encounters and persistence
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v3_alola_group01.gd 2>&1 | tee w04-v3-group01.log
          grep -E '^W04_AUTORUN_V3_ROW01 PASS checks=[1-9][0-9]* sources=6$' w04-v3-group01.log
      - name: Preserve prior real Slowpoke pilot
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v2_form_identity.gd 2>&1 | tee w04-v3-pilot.log
          grep -E '^W04_AUTORUN_V2_FORM PASS checks=[1-9][0-9]*$' w04-v3-pilot.log
      - name: Log artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-v3-group01-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w04-v3-*.log
