name: W01 TANDA04 Life Orb isolated L2 and L3 pilot
on:
  push:
    branches:
      - codex/calvo-items-20261110-w01-gems-autobatch01
    paths:
      - '.github/workflows/w01-autorun-v4-life-orb-pilot.yml'
      - 'tests/tools/repro_w01_autorun_v4_life_orb_native.cjs'
      - 'tests/tools/test_parallel_items_w01_autorun_v4_life_orb.py'
      - 'tests/gameplay/parallel_items_w01_autorun_v4_life_orb.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w01-v4-life-orb-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v4_life_orb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore canonical Godot resources and pinned Showdown
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/calvo-items-20261110-w01-gems-autobatch01'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w01-v4-life-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w01-v4-life-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee w01-v4-life-reference.log
      - name: Real Life Orb damage recoil negative modes and disk SaveV2
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_autorun_v4_life_orb.py 2>&1 | tee w01-v4-life-python.log
          grep -E '^W01_V4_LIFE_PY PASS row=02 checks=[1-9][0-9]*$' w01-v4-life-python.log
          node tests/tools/repro_w01_autorun_v4_life_orb_native.cjs 2>&1 | tee w01-v4-life-native.log
          grep -F 'W01_V4_NATIVE PASS id=life_orb variants=5 boost=1 recoil=1 immune=1 status=1 snapshots=5' w01-v4-life-native.log
          timeout 450s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_autorun_v4_life_orb.gd 2>&1 | tee w01-v4-life-godot.log
          grep -E '^W01_V4_L3_ROW PASS row=02 id=life_orb variants=4 checks=[1-9][0-9]*$' w01-v4-life-godot.log
      - name: Upload pilot logs, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-v4-life-orb-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w01-v4-life-*.log
