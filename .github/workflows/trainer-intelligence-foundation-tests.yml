name: Trainer Intelligence Foundation Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainer-intelligence-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FASE 20 trainer intelligence gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee trainer-intelligence-godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Stage pinned PokeAPI report fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee trainer-intelligence-import.log

      - name: Run trainer intelligence foundation suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path . --script res://tests/trainer_ai/trainer_intelligence_foundation_test_runner.gd 2>&1 | tee trainer-intelligence-test.log
          summary="$(grep -E '=== TRAINER INTELLIGENCE FOUNDATION RESULT: [0-9]+ PASS / 0 FAIL ===' trainer-intelligence-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 63 ]; then
            echo "Trainer intelligence regression: expected at least 63 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "FASE 20 trainer intelligence gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Upload trainer intelligence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-intelligence-logs-${{ github.run_id }}
          path: |
            trainer-intelligence-godot-version.log
            trainer-intelligence-import.log
            trainer-intelligence-test.log
          if-no-files-found: ignore
          retention-days: 7
