name: Temporary Trainer AI 26.60 append

on:
  push:
    branches:
      - tmp/trainer-ai-2660-freeze
    paths:
      - .github/workflows/trainer-ai-2660-freeze.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-2660-freeze

      - name: Append freeze 26.60
        shell: bash
        run: |
          set -euo pipefail
          cat docs/project_book/.trainer_ai_2660_payload.md >> docs/project_book/TRAINER_AI.md
          rm docs/project_book/.trainer_ai_2660_payload.md
          rm .github/workflows/trainer-ai-2660-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md docs/project_book/.trainer_ai_2660_payload.md .github/workflows/trainer-ai-2660-freeze.yml
          git commit -m 'docs(trainer-ai): stage freeze 26.60 C3f-al'
          git push origin HEAD:tmp/trainer-ai-2660-freeze
