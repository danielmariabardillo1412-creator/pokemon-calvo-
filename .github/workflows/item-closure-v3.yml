name: Item Closure V3 (EV, inventory and regressions)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: item-closure-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Item families / Godot 4.7 / pinned Node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Verify exact engine
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --version | grep -E '^4[.]7([.-]|$)'
          node --version
      - name: Configure pinned Node executable for Godot IPC
        shell: bash
        run: echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Restore existing visual resources with locked hashes
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
      - name: Fresh inventory and 2222-ID audit
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/item_audit/item_closure_v3.py | tee item-inventory-v3.log
          python -B tests/tools/test_item_closure_v3.py | tee item-audit-v3.log
          grep -E 'ITEM_CLOSURE_V3_AUDIT PASS checks=[1-9][0-9]* ids=2222' item-audit-v3.log
      - name: Import Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee item-import-v3.log
          if grep -E 'SCRIPT ERROR|Parse Error' item-import-v3.log; then exit 1; fi
      - name: Install pinned native simulation and run one reference check
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/battle_reference/run.py --install --limit 1 | tee item-reference-v3.log
          grep -E 'BATTLE_REFERENCE PASS' item-reference-v3.log
      - name: C - Re-exercise pinned native held-item and berry behaviors by family
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://tests/gameplay/item_effect_templates_v3.gd 2>&1 | tee item-c-templates-v3.log
          grep -E 'ITEM_EFFECT_TEMPLATES_V3 [1-9][0-9]*' item-c-templates-v3.log
          timeout 420s node tools/item_audit/held_effect_sweep_v3.cjs 2>&1 | tee item-c-native-v3.log
          grep -E 'ITEM_EFFECT_NATIVE_V3 [1-9][0-9]* PASS 0 FAIL' item-c-native-v3.log
          timeout 360s godot --headless --path . --script res://tests/gameplay/item_effect_projection_v3.gd 2>&1 | tee item-c-projection-v3.log
          if grep -E 'SCRIPT ERROR|Parse Error|timeout' item-c-projection-v3.log; then exit 1; fi
          grep -E 'ITEM_EFFECT_GODOT_V3 PASS checks=[1-9][0-9]* cases=[1-9][0-9]* pending=0' item-c-projection-v3.log
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('.godot/item_verification_v3')
          native = json.loads((base / 'native.json').read_text())
          godot = json.loads((base / 'godot.json').read_text())
          nr = native['results']
          gr = godot['results']
          assert len(nr) == len(gr) >= 120, (len(nr), len(gr))
          assert len({r['id'] for r in nr}) == 65
          assert all(r['status'] == 'NATIVE_SCENARIO_PASS' for r in nr)
          assert all(r['status'] == 'PASS' for r in native['branchChecks'])
          assert godot['pending_protocol_cases'] == 0 and not godot['errors']
          assert all(r['status'].endswith('_PASS') for r in gr)
          assert len({r['id'] for r in gr if r.get('live_ipc')}) == 65
          assert godot['checks'] >= 2000
          berry_ids = {r['id'] for r in gr if r['id'].endswith('_berry')}
          assert len(berry_ids) == 12, berry_ids
          print('ITEM_CLOSURE_V3_C PASS native_cases=', len(nr), 'ipc_ids=65 berry_ids=12 checks=', godot['checks'])
          PY
      - name: EV awards, six Power items, Macho Brace, native settlement and real bag
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --path . --script res://tests/gameplay/item_closure_v3_test_runner.gd 2>&1 | tee item-ev-v3.log
          if grep -E 'SCRIPT ERROR|Parse Error|timeout' item-ev-v3.log; then exit 1; fi
          grep -E 'ITEM_CLOSURE_V3 PASS checks=([5-9][0-9]|[1-9][0-9]{2,}) errors=0' item-ev-v3.log
      - name: Existing Lucky Egg and Everstone regression (unaltered)
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --path . --script res://tests/gameplay/progression_items_v18.gd 2>&1 | tee item-progression-v18.log
          if grep -E 'SCRIPT ERROR|Parse Error|timeout' item-progression-v18.log; then exit 1; fi
          grep -E 'PROGRESSION_ITEMS_V18 PASS checks=[1-9][0-9]*' item-progression-v18.log
      - name: Portable V27 gate (all existing affected groups)
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/verify_update.py --godot "$(command -v godot)" --node "$(command -v node)" 2>&1 | tee item-portable-gate-v3.log
      - name: Preserve CI logs and generated per-context matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-closure-v3-${{ github.run_id }}
          path: |
            item-*.log
            .godot/item_closure_v3/*.json
            .godot/publication_v27/runs/
          if-no-files-found: ignore
          retention-days: 14
