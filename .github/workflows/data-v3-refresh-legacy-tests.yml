name: DATA V3 Refresh Legacy Regression Fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/data-v3-refresh-legacy-tests.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feature/data-foundation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout DATA V3 branch
        uses: actions/checkout@v4
        with:
          ref: feature/data-foundation-v3
          fetch-depth: 0

      - name: Migrate legacy data assertions to V3 semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(text, name, replacement):
              pattern = rf'(?ms)^func {re.escape(name)}\(.*?(?=^func |\Z)'
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: expected one function, found {len(matches)}')
              return text[:matches[0].start()] + replacement.rstrip() + '\n\n' + text[matches[0].end():]

          p = Path('tests/test_runner.gd')
          text = p.read_text(encoding='utf-8')
          replacements = {
          '_test_pokeapi_manifest_valid': '''func _test_pokeapi_manifest_valid() -> void:
              var m := DatasetManifest.from_dict(_load_json("res://data/manifests/pokemon_api_manifest.json"))
              _check(
                  "pokeapi_manifest_valid",
                  m.is_valid()
                  and m.schema_version == 2
                  and m.dataset_version == "3.0.0"
                  and m.source == "pokeapi/v2-snapshot"
                  and m.ruleset == "latest_conventional_mainline_per_species_v1",
              )''',
          '_test_pokeapi_known_species': '''func _test_pokeapi_known_species() -> void:
              var gd := _import_pokeapi()
              var bulbasaur := gd.species_catalog.get_by_id(&"bulbasaur")
              _check(
                  "pokeapi_known_species",
                  bulbasaur != null
                  and bulbasaur.display_name == "Bulbasaur"
                  and gd.species_catalog.has(&"pikachu")
                  and gd.species_catalog.has(&"charizard")
                  and gd.species_catalog.has(&"mr_mime")
                  and gd.species_catalog.has(&"ho_oh")
                  and gd.species_catalog.has(&"porygon_z"),
              )''',
          '_test_pokeapi_forms_policy': '''func _test_pokeapi_forms_policy() -> void:
              var gd := _import_pokeapi()
              var fr: Dictionary = _load_json("res://data/reports/forms_policy_report.json")
              var forms: Array = fr.get("forms", [])
              _check("pokeapi_forms_policy", int(fr.get("forms_total", 0)) == forms.size() and forms.size() > 0)
              var no_form_variant_in_species_catalog := true
              for f in forms:
                  var form_id := StringName(String(f.get("pokemon_id", "")))
                  if form_id != &"" and gd.species_catalog.has(form_id):
                      no_form_variant_in_species_catalog = false
                      break
              _check("pokeapi_forms_not_in_catalog", no_form_variant_in_species_catalog)''',
          '_test_pokeapi_manifest_provenance': '''func _test_pokeapi_manifest_provenance() -> void:
              var m := DatasetManifest.from_dict(_load_json("res://data/manifests/pokemon_api_manifest.json"))
              var sha: String = m.provenance.get("source_commit", "")
              var lic: String = m.provenance.get("license", "")
              _check("pokeapi_manifest_sha_full", sha == "2f218ec3765c01c894a42bbbd074f15ddf3f32d1")
              _check("pokeapi_manifest_license_bsd", "BSD 3-Clause" in lic)
              _check(
                  "pokeapi_manifest_snapshot_trees",
                  m.provenance.get("source_api_tree", "") == "8349ea1ce75716897fe96e02a15950d19edba6c3"
                  and m.provenance.get("source_schema_tree", "") == "02e031e1928d7e9456bf6f7486daacc4b8946c84",
              )''',
          '_test_pokeapi_evolution_invariant': '''func _test_pokeapi_evolution_invariant() -> void:
              var um: Dictionary = _load_json("res://data/reports/unsupported_mechanics.json")
              var es: Dictionary = um.get("summary", {}).get("evolutions", {})
              var raw: Dictionary = _load_json("res://data/raw/pokemon_api.json")
              var gd := _import_pokeapi()
              var actual_evo := 0
              for sid in gd.species_catalog.all_ids():
                  actual_evo += gd.species_catalog.get_by_id(sid).evolutions.size()
              _check("pokeapi_evolution_source_invariant", int(es.get("SOURCE_RECORDS_PRESERVED", -1)) == actual_evo)
              _check("pokeapi_evolution_coverage_invariant", actual_evo > 0)
              _check("pokeapi_evolution_imported_matches_catalog", actual_evo == 554)
              var species_ids := {}
              for sp in raw.get("species", []):
                  species_ids[sp["id"]] = true
              var all_targets_present := true
              for sp in raw.get("species", []):
                  for ev in sp.get("evolutions", []):
                      if not species_ids.has(ev.get("species_id", "")):
                          all_targets_present = false
              _check("pokeapi_evolution_no_deferred_targets", all_targets_present)''',
          '_test_pokeapi_move_coverage_invariant': '''func _test_pokeapi_move_coverage_invariant() -> void:
              var um: Dictionary = _load_json("res://data/reports/unsupported_mechanics.json")
              var ms: Dictionary = um.get("summary", {}).get("moves", {})
              var gd := _import_pokeapi()
              var runtime_total := 0
              for key in ["RUNTIME_SUPPORTED", "PARTIAL_RUNTIME", "DATA_ONLY", "UNSUPPORTED"]:
                  runtime_total += int(ms.get(key, 0))
              _check("pokeapi_move_coverage_sums", runtime_total == gd.move_catalog.size())
              _check("pokeapi_move_dataready_matches_catalog", gd.move_catalog.size() == 919)
              _check("pokeapi_move_sidegame_exclusions", int(ms.get("EXCLUDED_NON_STANDARD_TYPE", 0)) == 18)''',
          '_test_pokeapi_ability_item_coverage_invariant': '''func _test_pokeapi_ability_item_coverage_invariant() -> void:
              var um: Dictionary = _load_json("res://data/reports/unsupported_mechanics.json")
              var gd := _import_pokeapi()
              _check("pokeapi_ability_dataready_matches_catalog", int(um["summary"]["abilities"].get("DATA_READY", -1)) == gd.ability_catalog.size())
              _check("pokeapi_item_dataready_matches_catalog", int(um["summary"]["items"].get("DATA_READY", -1)) == gd.item_catalog.size())''',
          }
          for name, replacement in replacements.items():
              text = replace_function(text, name, replacement)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/progression_test_suite.gd')
          text = p.read_text(encoding='utf-8')
          replacements = {
          '_test_learnset_queries': '''func _test_learnset_queries() -> void:
              var sp := _bulbasaur()
              var target_level := _level_up_move_level(sp, &"vine_whip")
              var previous_level := maxi(1, target_level - 1)
              var crossed := LearnsetSystem.level_up_moves_between(sp, previous_level, target_level)
              var has_vine := false
              for e in crossed:
                  if (e as LearnSetEntry).move_id == &"vine_whip":
                      has_vine = true
              _check.call("learnset_vine_whip_at_source_level", target_level > 1 and has_vine)
              var init := LearnsetSystem.initial_moves(sp, 1)
              _check.call("learnset_initial_not_over_cap", init.size() <= ProgressionRuleset.MOVE_SLOTS_MAX)
              _check.call("learnset_moves_learned_at_level", LearnsetSystem.moves_learned_at_level(sp, target_level).has(&"vine_whip"))''',
          '_test_gain_learns_move': '''func _test_gain_learns_move() -> void:
              var rs := _rs()
              var sp := _bulbasaur()
              var target_level := _level_up_move_level(sp, &"vine_whip")
              var previous_level := target_level - 1
              var c := CreatureInstance.new(&"c", &"bulbasaur", previous_level, StatBlock.new(), [])
              c.recalculate_stats(sp, rs)
              c.moveset.clear()
              c.move_ids.clear()
              c.experience = rs.experience_for_level("medium-slow", previous_level)
              var need := rs.experience_for_level("medium-slow", target_level) - c.experience
              var events := ProgressionSystem.gain_experience(c, need, sp, _catalog, rs)
              var learned := false
              for ev in events:
                  if (ev as ProgressionEvent).kind == ProgressionEvent.MOVE_LEARNED and (ev as ProgressionEvent).data.get("move_id") == &"vine_whip":
                      learned = true
              _check.call("gain_learns_vine_whip", learned and c.has_move(&"vine_whip"))
              _check.call("gain_reaches_source_move_level", c.level == target_level)''',
          '_test_gain_move_choice_required': '''func _test_gain_move_choice_required() -> void:
              var rs := _rs()
              var sp := _bulbasaur()
              var target_level := _level_up_move_level(sp, &"vine_whip")
              var previous_level := target_level - 1
              var filler := _four_valid_moves_excluding(&"vine_whip")
              var c := CreatureInstance.new(&"c", &"bulbasaur", previous_level, StatBlock.new(), filler)
              c.recalculate_stats(sp, rs)
              c.initialize_move_pp(_catalog)
              c.experience = rs.experience_for_level("medium-slow", previous_level)
              var need := rs.experience_for_level("medium-slow", target_level) - c.experience
              var events := ProgressionSystem.gain_experience(c, need, sp, _catalog, rs)
              var choice := false
              for ev in events:
                  if (ev as ProgressionEvent).kind == ProgressionEvent.MOVE_LEARN_CHOICE_REQUIRED and (ev as ProgressionEvent).data.get("new_move_id") == &"vine_whip":
                      choice = true
              _check.call("gain_move_choice_required", choice)
              _check.call("gain_moveset_full", c.moveset.size() == ProgressionRuleset.MOVE_SLOTS_MAX)''',
          '_test_move_choice_replace': '''func _test_move_choice_replace() -> void:
              var rs := _rs()
              var sp := _bulbasaur()
              var target_level := _level_up_move_level(sp, &"vine_whip")
              var previous_level := target_level - 1
              var filler := _four_valid_moves_excluding(&"vine_whip")
              var c := CreatureInstance.new(&"c", &"bulbasaur", previous_level, StatBlock.new(), filler)
              c.recalculate_stats(sp, rs)
              c.initialize_move_pp(_catalog)
              c.experience = rs.experience_for_level("medium-slow", previous_level)
              var need := rs.experience_for_level("medium-slow", target_level) - c.experience
              var events := ProgressionSystem.gain_experience(c, need, sp, _catalog, rs)
              var choice: ProgressionEvent = null
              for ev in events:
                  if (ev as ProgressionEvent).kind == ProgressionEvent.MOVE_LEARN_CHOICE_REQUIRED and (ev as ProgressionEvent).data.get("new_move_id") == &"vine_whip":
                      choice = ev as ProgressionEvent
              var old_move: StringName = c.move_ids[0]
              var ok := ProgressionSystem.apply_move_choice(c, choice, ProgressionSystem.REPLACE_MOVE, _catalog, old_move)
              _check.call("move_choice_replace_ok", ok and c.has_move(&"vine_whip") and not c.has_move(old_move))''',
          '_test_move_choice_decline': '''func _test_move_choice_decline() -> void:
              var rs := _rs()
              var sp := _bulbasaur()
              var target_level := _level_up_move_level(sp, &"vine_whip")
              var previous_level := target_level - 1
              var filler := _four_valid_moves_excluding(&"vine_whip")
              var c := CreatureInstance.new(&"c", &"bulbasaur", previous_level, StatBlock.new(), filler)
              c.recalculate_stats(sp, rs)
              c.initialize_move_pp(_catalog)
              c.experience = rs.experience_for_level("medium-slow", previous_level)
              var need := rs.experience_for_level("medium-slow", target_level) - c.experience
              var events := ProgressionSystem.gain_experience(c, need, sp, _catalog, rs)
              var choice: ProgressionEvent = null
              for ev in events:
                  if (ev as ProgressionEvent).kind == ProgressionEvent.MOVE_LEARN_CHOICE_REQUIRED and (ev as ProgressionEvent).data.get("new_move_id") == &"vine_whip":
                      choice = ev as ProgressionEvent
              var before := c.moveset.size()
              var ok := ProgressionSystem.apply_move_choice(c, choice, ProgressionSystem.DECLINE_MOVE, _catalog)
              _check.call("move_choice_decline_ok", ok and c.moveset.size() == before and not c.has_move(&"vine_whip"))''',
          '_test_evolution_coverage_invariant': '''func _test_evolution_coverage_invariant() -> void:
              var report := EvolutionSystem.coverage_report(_catalog)
              var expected_total := 0
              for sid in _catalog.species_catalog.all_ids():
                  expected_total += _catalog.species_catalog.get_by_id(sid).evolutions.size()
              _check.call("evo_coverage_total", report["edges_total"] == expected_total)
              var counts: Dictionary = report["counts"]
              var sum := 0
              for k in counts.keys():
                  sum += int(counts[k])
              _check.call("evo_coverage_sum", sum == expected_total)
              _check.call("evo_coverage_has_unsupported", int(counts[EvolutionSystem.UNSUPPORTED]) > 0)
              _check.call("evo_coverage_has_runtime", int(counts[EvolutionSystem.RUNTIME_SUPPORTED]) > 0)''',
          }
          for name, replacement in replacements.items():
              text = replace_function(text, name, replacement)

          marker = 'func _four_valid_moves_excluding(exclude: StringName) -> Array[StringName]:'
          helper = '''func _level_up_move_level(species: CreatureSpecies, move_id: StringName) -> int:
              for entry in species.learnset:
                  if entry is LearnSetEntry and (entry as LearnSetEntry).method == LearnsetSystem.LEVEL_UP and (entry as LearnSetEntry).move_id == move_id:
                      return (entry as LearnSetEntry).level
              return -1


          '''
          if marker not in text:
              raise RuntimeError('progression helper marker not found')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate V3 reports and normalized summary
        shell: bash
        run: |
          set -euo pipefail
          python tools/pokeapi_adapter_v3.py

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Normalize and generate import summary
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import >/tmp/data-v3-migrate-import.log 2>&1
          timeout 480s godot --headless --path . --script res://tools/run_import.gd | tee /tmp/data-v3-migrate-normalize.log
          grep -F 'broken_references=0 rejected=0' /tmp/data-v3-migrate-normalize.log

      - name: Refresh pinned V3 report fixtures
        shell: bash
        run: |
          set -euo pipefail
          cp data/reports/forms_policy_report.json ci/fixtures/pokeapi_reports/forms_policy_report.json
          cp data/reports/unsupported_mechanics.json ci/fixtures/pokeapi_reports/unsupported_mechanics.json
          cp data/reports/import_summary.json ci/fixtures/pokeapi_reports/import_summary.json

      - name: Smoke test migrated project suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee /tmp/data-v3-migrated-project.log
          grep -E '=== PROJECT TEST RESULT: [0-9]+ PASS / 0 FAIL ===' /tmp/data-v3-migrated-project.log

      - name: Commit V3 regression migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_runner.gd tests/progression_test_suite.gd ci/fixtures/pokeapi_reports/forms_policy_report.json ci/fixtures/pokeapi_reports/unsupported_mechanics.json ci/fixtures/pokeapi_reports/import_summary.json
          git commit -m 'test(data-v3): align canonical regressions with snapshot policy'
          git push origin HEAD:feature/data-foundation-v3
