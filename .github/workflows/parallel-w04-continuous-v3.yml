name: W04 V3 - real regional evolutions and full regressions
on:
  push:
    branches: [codex/calvo-items-20261104-w04-camp006]
    paths:
      - '.github/workflows/parallel-w04-continuous-v3.yml'
      - 'modules/creatures/progression/evolution_system.gd'
      - 'modules/inventory/field_item_service.gd'
      - 'tests/gameplay/w04_continuous_v3_red_destinations.gd'
      - 'tests/gameplay/w04_continuous_v3_real_evolution.gd'
      - 'tests/gameplay/w04_continuous_v3_fail_publish_service.gd'
      - 'tests/gameplay/w04_autorun_v5_regional_evolution.gd'
      - 'tests/tools/test_parallel_items_w04_autorun_v1.py'
      - 'modules/creatures/progression/regional_item_evolution_contract_w04_v2.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore source and import
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04-v3-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04-v3-import.log; then exit 1; fi
      - name: Phase A canonical evolution destination
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_continuous_v3_red_destinations.gd 2>&1 | tee w04-v3-a.log
          grep -E '^W04_V3_A PASS seven_real_destinations$' w04-v3-a.log
      - name: Phase B seven real evolutions in Party and Storage
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w04_continuous_v3_real_evolution.gd 2>&1 | tee w04-v3-b.log
          grep -E '^W04_V3_L3 PASS checks=[1-9][0-9]* routes=7 ownership=14 rollback=2$' w04-v3-b.log
      - name: V2 seven regional L2 contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_continuous_v2_regional_items.gd 2>&1 | tee w04-v2-items.log
          grep -E '^W04_V2_B02 PASS checks=[1-9][0-9]* L3=0$' w04-v2-items.log
      - name: V2 regional Factory persistence
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_continuous_v2_regional_persistence.gd 2>&1 | tee w04-v2-b03.log
          grep -E '^W04_V2_B03 PASS checks=[1-9][0-9]* L3=0$' w04-v2-b03.log
      - name: V5 Galarica contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v5_regional_evolution.gd 2>&1 | tee w04-v5.log
          grep -E '^W04_AUTORUN_V5 PASS checks=[1-9][0-9]* routes=2 L3=0$' w04-v5.log
      - name: V4 normal ability regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v4_ability.gd 2>&1 | tee w04-v4.log
          grep -E '^W04_AUTORUN_V4 PASS checks=[1-9][0-9]* promoted=4 blocked=1$' w04-v4.log
      - name: V3 regional forms 55 of 56
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w04_autorun_v3_all_regional.gd 2>&1 | tee w04-regional-forms.log
          grep -E '^W04_AUTORUN_V3_ALL PASS checks=[1-9][0-9]* examined=56 native_functional=55 blocked=1$' w04-regional-forms.log
      - name: V2 canonical form pilot
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v2_form_identity.gd 2>&1 | tee w04-pilot.log
          grep -E '^W04_AUTORUN_V2_FORM PASS checks=[1-9][0-9]*$' w04-pilot.log
      - name: Historical Python CAMP003-006 and autorun
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_003.py --ci
          python -B tests/tools/test_parallel_items_w04_campaign_004.py --ci
          python -B tests/tools/test_parallel_items_w04_campaign_005.py --ci
          python -B tests/tools/test_parallel_items_w04_campaign_006.py --ci
          python -B tests/tools/test_parallel_items_w04_autorun_v1.py --ci
          python -B tests/tools/test_w04_autorun_v2_form_identity.py
      - name: Historical Godot CAMP003-006 and resolvers
        shell: bash
        run: |
          set -euo pipefail
          for case in parallel_items_w04_campaign_003 parallel_items_w04_campaign_004 parallel_items_w04_campaign_005 parallel_items_w04_campaign_006 parallel_items_w04_condition_resolver parallel_items_w04_milcery_resolver; do
            timeout 900s godot --headless --path . --script "res://tests/gameplay/${case}.gd" 2>&1 | tee "w04-v3-${case}.log"
            if grep -E 'SCRIPT ERROR|Parse Error| FAIL ' "w04-v3-${case}.log"; then exit 1; fi
          done
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-v3-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            w04-v3-*.log
            w04-v2-*.log
            w04-v4.log
            w04-v5.log
            w04-regional-forms.log
            w04-pilot.log
