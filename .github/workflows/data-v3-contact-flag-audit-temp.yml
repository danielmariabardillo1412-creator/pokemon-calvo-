name: TEMP Data V3 Contact Flag Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Compare generated contact flags with pinned PokéAPI CSV
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate DATA V3 raw dataset
        shell: bash
        run: |
          set -euo pipefail
          python tools/pokeapi_adapter_v3.py

      - name: Audit move contact flags
        id: contact_audit
        shell: bash
        run: |
          set -o pipefail
          python tools/audit_move_contact_flags.py 2>&1 | tee data-v3-contact-flag-audit.log

      - name: Upload contact audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-v3-contact-flag-audit-${{ github.run_id }}
          path: |
            data-v3-contact-flag-audit.log
            data/reports/contact_flag_audit.json
            data/reports/move_flags_override_complete.json
          if-no-files-found: warn
          retention-days: 7
