name: CAMP004 - W03 captura campo y Tera
on:
  push:
    branches:
      - codex/calvo-items-20261103-w03-camp004
    paths:
      - '.github/workflows/parallel-camp004-w03-autoci.yml'
      - 'tests/tools/test_parallel_items_campaign_004_w03_manifest.py'
      - 'tests/tools/test_parallel_items_*_campaign_004.py'
      - 'tests/gameplay/parallel_items_*_campaign_004.gd'
      - 'tests/fixtures/parallel_items/*_campaign_004.json'
      - 'modules/**' # Las reparaciones funcionales propias tambien disparan CI
      - 'docs/coordination/items_parallel_v1/reports/*/CAMP_004_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/*/CAMP_004_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp004-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contrato de propiedad y progreso
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-w03-*) W=W03 ;;
            *) echo "Rama no autorizada"; exit 1 ;;
          esac
          echo "worker=$W" >> "$GITHUB_OUTPUT"
          python -B tests/tools/test_parallel_items_campaign_004_w03_manifest.py --worker "$W"
          blocks=$(python -B tests/tools/test_parallel_items_campaign_004_w03_manifest.py --worker "$W" --count-only)
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"
          echo "CAMP004_SCOPE worker=$W blocks=$blocks"
      - name: Bootstrap explicito, NO prueba funcional
        if: steps.scope.outputs.blocks == '0'
        run: echo "BOOTSTRAP_VALIDADO_SIN_NINGUN_BLOQUE_FUNCIONAL"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.blocks != '0'
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        if: steps.scope.outputs.blocks != '0'
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Importar Godot 4.7 y recursos de prueba
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp004-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp004-import.log; then exit 1; fi
          if [ "${{ steps.scope.outputs.worker }}" = W01 ] || [ "${{ steps.scope.outputs.worker }}" = W02 ]; then
            echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
            python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee camp004-native.log
          fi
      - name: Contratos Python por familia y numero exacto de bloques
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          W="${{ steps.scope.outputs.worker }}"
          B="${{ steps.scope.outputs.blocks }}"
          id=$(echo "$W" | tr '[:upper:]' '[:lower:]')
          py="tests/tools/test_parallel_items_${id}_campaign_004.py"
          test -f "$py"
          python -B "$py" --ci 2>&1 | tee camp004-python.log
          python -B tests/tools/test_parallel_items_campaign_004_w03_manifest.py --worker "$W" --verify-output PY --log camp004-python.log
      - name: Contratos Godot por familia y numero exacto de bloques
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          W="${{ steps.scope.outputs.worker }}"
          id=$(echo "$W" | tr '[:upper:]' '[:lower:]')
          gd="tests/gameplay/parallel_items_${id}_campaign_004.gd"
          test -f "$gd"
          timeout 600s godot --headless --path . --script "res://$gd" 2>&1 | tee camp004-godot.log
          python -B tests/tools/test_parallel_items_campaign_004_w03_manifest.py --worker "$W" --verify-output GODOT --log camp004-godot.log
      - name: Regresion de W03 CAMP002
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w03_campaign_002.py 2>&1 | tee camp004-old-negative.log
      - name: Regresion completa CAMP003 W03 (20 Pokeballs previas)
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w03_campaign_003.py --ci 2>&1 | tee camp004-regression-camp003-python.log
          grep -E '^CAMP003_W03_PY PASS blocks=10 checks=[1-9][0-9]*$' camp004-regression-camp003-python.log
          timeout 600s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_campaign_003.gd 2>&1 | tee camp004-regression-camp003-godot.log
          grep -E '^CAMP003_W03_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp004-regression-camp003-godot.log
      - name: Publicar evidencia efimera
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp004-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: camp004-*.log
