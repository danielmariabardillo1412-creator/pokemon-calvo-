name: Repository Tests Layout Audit

on:
  push:
    branches:
      - chore/repository-organization-v1
    paths:
      - '.github/workflows/repository-tests-layout-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-organization-v1
          fetch-depth: 0

      - name: Build tests layout inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          files = sorted(
              p for p in subprocess.check_output(['git', 'ls-files', 'tests'], text=True).splitlines()
              if p.endswith('.gd')
          )

          def group(path: str) -> str:
              name = Path(path).name
              if name == 'test_runner.gd':
                  return 'root'
              if name.startswith('trainer_'):
                  return 'trainer_ai'
              if name.startswith('battle_'):
                  return 'battle'
              if name.startswith(('data_foundation_', 'spanish_')):
                  return 'data'
              if name.startswith(('inventory_', 'savegame_', 'wild_', 'overworld_', 'vertical_slice_')):
                  return 'gameplay'
              if name.startswith(('progression_', 'capture_', 'party_', 'storage_')):
                  return 'gameplay'
              return 'UNCLASSIFIED'

          groups = {}
          for path in files:
              groups.setdefault(group(path), []).append(path)

          with open('tests_layout_tmp.txt', 'w', encoding='utf-8') as f:
              f.write(f'total_gd={len(files)}\n')
              for key in ('root', 'battle', 'data', 'gameplay', 'trainer_ai', 'UNCLASSIFIED'):
                  items = groups.get(key, [])
                  f.write(f'\n=== {key} ({len(items)}) ===\n')
                  for path in items:
                      dest = path if key in ('root', 'UNCLASSIFIED') else f"tests/{key}/{Path(path).name}"
                      f.write(f'{path} -> {dest}\n')
          print(Path('tests_layout_tmp.txt').read_text(encoding='utf-8'))
          PY

      - name: Upload layout inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-tests-layout-${{ github.run_id }}
          path: tests_layout_tmp.txt
          if-no-files-found: error
          retention-days: 1
