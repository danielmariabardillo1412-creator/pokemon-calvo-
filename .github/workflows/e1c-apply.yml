name: E1C Apply

on:
  push:
    branches: [feature/trainer-ai-expertise-v1]

jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trainer-ai-expertise-v1
          fetch-depth: 0
      - name: Tighten guarded duplicate occurrence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/e1c_apply.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          new = '''    count = text.count(old)\n    duplicate_report_block = (\n        path == "modules/trainer_ai/trainer_item_aware_action_proposal.gd"\n        and old.startswith('\\t\\t"root_all_legal": true,\\n\\t\\t"inner_max_actions_per_side": INNER_ACTION_CAP')\n    )\n    if count == 2 and duplicate_report_block:\n        write(path, text.replace(old, new, 1))\n        return\n    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          if s.count(old) != 1:
              raise SystemExit('helper guard function did not match exactly once')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: python3 tools/e1c_apply.py
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/e1c-apply.yml tools/e1c_apply.py
          git add modules tests docs/project_book/TRAINER_AI_EXPERTISE.md
          git diff --cached --check
          git commit -m "feat(trainer-ai): integrate style and expertise runtime"
          git push origin HEAD:feature/trainer-ai-expertise-v1
