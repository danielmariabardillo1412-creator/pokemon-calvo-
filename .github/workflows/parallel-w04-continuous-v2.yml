name: W04 CONTINUOUS V2 - regional evolution L2 and persistence
on:
  push:
    branches: [codex/calvo-items-20261104-w04-camp006]
    paths:
      - '.github/workflows/parallel-w04-continuous-v2.yml'
      - 'modules/creatures/progression/regional_item_evolution_contract_w04_v2.gd'
      - 'tests/gameplay/w04_continuous_v2_regional_items.gd'
      - 'tests/gameplay/w04_continuous_v2_regional_persistence.gd'
      - 'docs/coordination/items_parallel_v1/reports/W04/CONTINUOUS_V2_REGIONAL_EVOLUTION_MATRIX.csv'
      - 'modules/creatures/progression/canonical_form_identity_w04.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore source and import
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04-v2-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04-v2-import.log; then exit 1; fi
      - name: B02 seven regional item contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_continuous_v2_regional_items.gd 2>&1 | tee w04-v2-items.log
          grep -E '^W04_V2_B02 PASS checks=[1-9][0-9]* L3=0$' w04-v2-items.log
      - name: B03 Factory Party Storage SaveV2
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_continuous_v2_regional_persistence.gd 2>&1 | tee w04-v2-b03.log
          grep -E '^W04_V2_B03 PASS checks=[1-9][0-9]* L3=0$' w04-v2-b03.log
      - name: Historical V5 Galarica contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v5_regional_evolution.gd 2>&1 | tee w04-v5-evolution.log
          grep -E '^W04_AUTORUN_V5 PASS checks=[1-9][0-9]* routes=2 L3=0$' w04-v5-evolution.log
      - name: Historical V4 abilities
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v4_ability.gd 2>&1 | tee w04-v4-ability.log
          grep -E '^W04_AUTORUN_V4 PASS checks=[1-9][0-9]* promoted=4 blocked=1$' w04-v4-ability.log
      - name: Historical V3 regional forms
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w04_autorun_v3_all_regional.gd 2>&1 | tee w04-v3-all.log
          grep -E '^W04_AUTORUN_V3_ALL PASS checks=[1-9][0-9]* examined=56 native_functional=55 blocked=1$' w04-v3-all.log
      - name: Historical V2 form pilot
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v2_form_identity.gd 2>&1 | tee w04-v2-pilot.log
          grep -E '^W04_AUTORUN_V2_FORM PASS checks=[1-9][0-9]*$' w04-v2-pilot.log
      - name: Historical Python gates
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_003.py --ci
          python -B tests/tools/test_parallel_items_w04_campaign_004.py --ci
          python -B tests/tools/test_parallel_items_w04_campaign_005.py --ci
          python -B tests/tools/test_parallel_items_w04_campaign_006.py --ci
          python -B tests/tools/test_parallel_items_w04_autorun_v1.py --ci
          python -B tests/tools/test_w04_autorun_v2_form_identity.py
      - name: Historical Godot CAMP003-006 and resolvers
        shell: bash
        run: |
          set -euo pipefail
          for case in parallel_items_w04_campaign_003 parallel_items_w04_campaign_004 parallel_items_w04_campaign_005 parallel_items_w04_campaign_006 parallel_items_w04_condition_resolver parallel_items_w04_milcery_resolver; do
            timeout 900s godot --headless --path . --script "res://tests/gameplay/${case}.gd" 2>&1 | tee "w04-regression-${case}.log"
            if grep -E 'SCRIPT ERROR|Parse Error| FAIL ' "w04-regression-${case}.log"; then exit 1; fi
          done
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-continuous-v2-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            w04-v2-*.log
            w04-v3-*.log
            w04-v4-*.log
            w04-v5-*.log
            w04-regression-*.log
