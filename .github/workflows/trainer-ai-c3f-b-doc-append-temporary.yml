name: TEMP Trainer AI C3f-b notebook append

on:
  push:
    branches:
      - audit/trainer-ai-c3f-b-doc-staging

permissions:
  contents: write

jobs:
  append-c3f-b-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3f-b-doc-staging
      - name: Append C3f-b checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/trainer_ai_c3f_b_readiness_formula_comparison.md >> docs/project_book/TRAINER_AI.md
          rm .audit/trainer_ai_c3f_b_readiness_formula_comparison.md
          rm .github/workflows/trainer-ai-c3f-b-doc-append-temporary.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md .audit/trainer_ai_c3f_b_readiness_formula_comparison.md .github/workflows/trainer-ai-c3f-b-doc-append-temporary.yml
          git diff --cached --check
          git commit -m 'docs(trainer-ai): record C3f-b readiness formula comparison'
          git push origin HEAD:audit/trainer-ai-c3f-b-doc-staging
