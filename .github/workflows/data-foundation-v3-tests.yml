name: Data Foundation V3 Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-foundation-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PokeAPI snapshot canonical import V3
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify snapshot source is present
        shell: bash
        run: |
          set -euo pipefail
          test -f data/api/v2/pokemon/94/index.json
          test -f data/api/v2/pokemon/127/index.json
          test -f 'data/schema/v2/pokemon/$id/index.json'
          test -f data/POKEAPI_DATA_LICENSE.txt

      - name: Audit V3 adapter without writing outputs
        shell: bash
        run: |
          set -euo pipefail
          python tools/pokeapi_adapter_v3.py --check-only 2>&1 | tee data-v3-check.log
          grep -F '"exactly_18_standard_types": true' data-v3-check.log
          grep -F '"gengar_single_version_group": true' data-v3-check.log
          grep -F '"pinsir_single_version_group": true' data-v3-check.log
          grep -F '"hyphenated_base_species_preserved": true' data-v3-check.log
          grep -F '"all_default_species_use_mainline_learnsets": true' data-v3-check.log
          grep -F '"no_broken_references": true' data-v3-check.log

      - name: Regenerate canonical raw dataset from snapshot
        shell: bash
        run: |
          set -euo pipefail
          python tools/pokeapi_adapter_v3.py 2>&1 | tee data-v3-generate.log

      - name: Validate generated raw invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          raw = json.load(open('data/raw/pokemon_api.json', encoding='utf-8'))
          species = {x['id']: x for x in raw['species']}
          types = {x['id']: x for x in raw['types']}
          moves = {x['id']: x for x in raw['moves']}

          def has_effect(specs, kind):
              for spec in specs:
                  if spec.get('kind') == kind:
                      return True
                  if has_effect(spec.get('children', []), kind):
                      return True
              return False

          def effects(specs, kind):
              out = []
              for spec in specs:
                  if spec.get('kind') == kind:
                      out.append(spec)
                  out.extend(effects(spec.get('children', []), kind))
              return out

          assert len(types) == 18
          assert len(moves) == 919
          assert types['fire']['display_name'] == 'Fuego'
          assert 'mr_mime' in species and 'ho_oh' in species and 'porygon_z' in species
          assert not any(mid.startswith('shadow_') and moves[mid]['type_id'] not in types for mid in moves)
          assert 'shadow_blast' not in moves and 'shadow_rush' not in moves
          assert species['gengar']['source_metadata']['learnset_version_group'] == 'scarlet-violet'
          assert species['pinsir']['source_metadata']['learnset_version_group'] == 'brilliant-diamond-shining-pearl'
          assert len({e.get('version_group') for e in species['gengar']['learnset'] if e.get('version_group')}) == 1
          assert len({e.get('version_group') for e in species['pinsir']['learnset'] if e.get('version_group')}) == 1
          assert moves['tackle']['display_name'] in ('Placaje', 'Tackle')

          # Post-reorganization V3 compatibility gates. These protect curated
          # contact metadata and normalized legacy move classifications.
          assert moves['tackle']['makes_contact'] is True
          assert moves['thunder_punch']['makes_contact'] is True
          assert moves['astonish']['makes_contact'] is True
          assert moves['astonish']['classification'] == 'RUNTIME_SUPPORTED'
          assert has_effect(moves['astonish']['effect_specs'], 'flinch')
          for move_id in ('sleep_talk', 'me_first', 'mirror_move', 'nature_power'):
              assert moves[move_id]['classification'] == 'UNSUPPORTED', (
                  move_id, moves[move_id]['classification'])

          # Healing semantics audit V1. Never expose an executable effect that
          # contradicts the move's known target/condition just to increase coverage.
          for move_id in ('heal_order', 'milk_drink', 'recover', 'slack_off', 'soft_boiled'):
              assert moves[move_id]['classification'] == 'RUNTIME_SUPPORTED', move_id
              heals = effects(moves[move_id]['effect_specs'], 'heal')
              assert len(heals) == 1 and heals[0]['target'] == 'self', (move_id, heals)
              assert heals[0]['ratio_basis_points'] == 5000, (move_id, heals)

          assert moves['heal_pulse']['classification'] == 'RUNTIME_SUPPORTED'
          heals = effects(moves['heal_pulse']['effect_specs'], 'heal')
          assert len(heals) == 1 and heals[0]['target'] == 'opponent'
          assert heals[0]['ratio_basis_points'] == 5000

          assert moves['floral_healing']['classification'] == 'PARTIAL_RUNTIME'
          heals = effects(moves['floral_healing']['effect_specs'], 'heal')
          assert len(heals) == 1 and heals[0]['target'] == 'opponent'
          assert heals[0]['ratio_basis_points'] == 5000

          for move_id in ('life_dew', 'jungle_healing'):
              assert moves[move_id]['classification'] == 'PARTIAL_RUNTIME', move_id
              heals = effects(moves[move_id]['effect_specs'], 'heal')
              assert len(heals) == 1 and heals[0]['target'] == 'self', (move_id, heals)
              assert heals[0]['ratio_basis_points'] == 2500, (move_id, heals)
          cures = effects(moves['jungle_healing']['effect_specs'], 'cure_status')
          assert len(cures) == 1 and cures[0]['target'] == 'self', cures

          for move_id in ('moonlight', 'morning_sun', 'roost', 'shore_up', 'synthesis'):
              assert moves[move_id]['classification'] == 'PARTIAL_RUNTIME', move_id
              heals = effects(moves[move_id]['effect_specs'], 'heal')
              assert len(heals) == 1 and heals[0]['target'] == 'self', (move_id, heals)
              assert heals[0]['ratio_basis_points'] == 5000, (move_id, heals)

          assert moves['purify']['classification'] == 'PARTIAL_RUNTIME'
          assert effects(moves['purify']['effect_specs'], 'heal') == []
          cures = effects(moves['purify']['effect_specs'], 'cure_status')
          assert len(cures) == 1 and cures[0]['target'] == 'opponent', cures

          assert moves['swallow']['classification'] == 'UNSUPPORTED'
          assert moves['swallow']['effect_specs'] == []

          bulba = species['bulbasaur']
          assert any(x['ability_id'] == 'chlorophyll' and x['is_hidden'] for x in bulba.get('ability_slots', []))
          exact = set()
          for sid, sp in species.items():
              assert sp['source_metadata']['learnset_selection_reason'] == 'mainline_priority', (sid, sp['source_metadata'])
              for e in sp['learnset']:
                  k = (sid, e['move_id'], e['method'], e['level'], e.get('order', -1), e.get('version_group', ''))
                  assert k not in exact, k
                  exact.add(k)
          print('RAW V3 invariants OK: species=%d moves=%d learnset_entries=%d' % (
              len(species), len(moves), len(exact)))
          PY

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee data-v3-godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee data-v3-godot-import.log

      - name: Run V3 domain provenance tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://tests/data/data_foundation_v3_domain_test_runner.gd 2>&1 | tee data-v3-domain-test.log
          grep -E '=== DATA FOUNDATION V3 DOMAIN RESULT: [0-9]+ PASS / 0 FAIL ===' data-v3-domain-test.log

      - name: Normalize through authoritative DataImporter
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s godot --headless --path . --script res://tools/run_import.gd 2>&1 | tee data-v3-normalize.log
          grep -F 'broken_references=0 rejected=0' data-v3-normalize.log
          python - <<'PY'
          import json
          report = json.load(open('data/reports/import_summary.json', encoding='utf-8'))
          assert report['broken_references'] == []
          assert report['rejected'] == []
          assert 'unsupported:species:ability_slots' not in report['warnings']
          assert 'unsupported:species:source_metadata' not in report['warnings']
          assert report['source_commit'] == '2f218ec3765c01c894a42bbbd074f15ddf3f32d1'
          assert report['moves_total'] == 919
          print('NORMALIZED V3 import is clean')
          PY

      - name: Run Spanish/type/runtime regression against regenerated data
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s godot --headless --path . --script res://tests/data/spanish_types_foundation_test_runner.gd 2>&1 | tee data-v3-runtime-test.log
          grep -E '=== SPANISH TYPES FOUNDATION RESULT: [0-9]+ PASS / 0 FAIL ===' data-v3-runtime-test.log

      - name: Upload DATA V3 tested outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-foundation-v3-${{ github.run_id }}
          path: |
            data-v3-check.log
            data-v3-generate.log
            data-v3-godot-version.log
            data-v3-godot-import.log
            data-v3-domain-test.log
            data-v3-normalize.log
            data-v3-runtime-test.log
            data/raw/pokemon_api.json
            data/normalized/pokemon_api.json
            data/manifests/pokemon_api_manifest.json
            data/reports/forms_policy_report.json
            data/reports/unsupported_mechanics.json
            data/reports/pokeapi_v3_audit.json
            data/reports/pokeapi_v3_auxiliary.json
            data/reports/import_summary.json
          if-no-files-found: ignore
          retention-days: 7
