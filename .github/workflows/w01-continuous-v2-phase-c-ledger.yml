name: W01 CONTINUOUS_V2 Phase C ledger and ownership audit
on:
  push:
    branches:
      - codex/calvo-items-20261110-w01-gems-autobatch01
    paths:
      - '.github/workflows/w01-continuous-v2-phase-c-ledger.yml'
      - 'tests/tools/test_w01_continuous_v2_phase_c_ledger.py'
      - 'docs/coordination/items_parallel_v1/reports/W01/AUTORUN_V4_PROGRESS.csv'
      - 'docs/coordination/items_parallel_v1/reports/W01/CONTINUOUS_V2_PHASE_B_PROGRESS.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w01_phase_c_ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact A+B ledger, scope and dependencies
        run: |
          set -euo pipefail
          python -B tests/tools/test_w01_continuous_v2_phase_c_ledger.py | tee w01-phase-c-ledger.log
          grep -E '^W01_PHASE_C_LEDGER PASS A=10 B_cert=[0-9]+ B_pilots_pending=[0-9]+ external=4 candidate_total=36 implemented_new=0$' w01-phase-c-ledger.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w01-v2-phase-c-ledger-${{ github.run_id }}
          path: w01-phase-c-ledger.log
          if-no-files-found: ignore
          retention-days: 7
