  v3_l3_field_path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import native FieldItemService and real SaveV2 resources
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w01-v3-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w01-v3-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee w01-v3-native-install.log
      - name: Verify immutable inventory to session provenance
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_autorun_v3.py 2>&1 | tee w01-v3-static.log
          grep -E '^W01_V3_PY PASS items=18 milestones=10 checks=[1-9][0-9]*$' w01-v3-static.log
      - name: Real FieldItemService equip and FieldNativeSession settlement into SaveV2
        shell: bash
        run: |
          set -euo pipefail
          timeout 1300s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_autorun_v3.gd 2>&1 | tee w01-v3-native-l3.log
          grep -E '^W01_V3_GODOT PASS ids=18 rejections=5 legacy=1 checks=[1-9][0-9]*$' w01-v3-native-l3.log
          test "$(grep -c '^W01_V3_L3_ROW PASS id=' w01-v3-native-l3.log)" -eq 18
