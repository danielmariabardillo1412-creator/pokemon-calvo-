          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w01-v2-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w01-v2-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee w01-v2-reference.log
      - name: TANDA01 frozen Gem positives and SaveV2
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_autorun_v1.py 2>&1 | tee w01-v2-v1-python.log
          grep -E '^W01_AUTORUN_PY PASS rows=10 checks=85$' w01-v2-v1-python.log
          timeout 1650s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_autorun_v1.gd 2>&1 | tee w01-v2-v1-godot.log
          grep -E '^W01_AUTORUN_GODOT PASS rows=10 checks=4002$' w01-v2-v1-godot.log
          test "$(grep -c '^AUTORUN_W01_ROW_PASS row=' w01-v2-v1-godot.log)" -eq 10
      - name: Upload traceable logs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-v2-tanda01_regression-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w01-v2-*.log
