name: W01 V4 stage gem negative transactions
on:
  push:
    branches:
      - codex/calvo-ia6-staging-20261111-w01-held
    paths:
      - '.github/workflows/w01-continuous-v4-gem-negative.yml'
      - 'tests/gameplay/w01_continuous_v4_gem_negative.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gem_negative_l3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore canonical Godot and native runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w01-gem-neg-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w01-gem-neg-import.log; then exit 1; fi
          python -B tools/battle_reference/run.py --install --limit 1
      - name: Real bag negative transactions and disk SaveV2
        shell: bash
        run: |
          set -euo pipefail
          timeout 200s godot --headless --path . --script res://tests/gameplay/w01_continuous_v4_gem_negative.gd 2>&1 | tee w01-gem-neg-test.log
          grep -E '^W01_V4_GEM_NEGATIVE PASS checks=[2-9][0-9] errors=0$' w01-gem-neg-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w01-v4-gem-negative-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w01-gem-neg-*.log
