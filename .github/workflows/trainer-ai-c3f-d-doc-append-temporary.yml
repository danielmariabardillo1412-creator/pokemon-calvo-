name: TEMP Trainer AI C3f-d notebook append

on:
  push:
    branches:
      - audit/trainer-ai-c3f-d-doc-staging

permissions:
  contents: write

jobs:
  append-c3f-d-doc:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'docs(audit): trigger C3f-d notebook append' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3f-d-doc-staging
      - name: Append C3f-d checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/trainer_ai_c3f_d_readiness_components_production.md >> docs/project_book/TRAINER_AI.md
          rm .audit/trainer_ai_c3f_d_readiness_components_production.md
          rm .github/workflows/trainer-ai-c3f-d-doc-append-temporary.yml
          rm .audit/trainer_ai_c3f_d_doc_trigger.marker
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md .audit/trainer_ai_c3f_d_readiness_components_production.md .github/workflows/trainer-ai-c3f-d-doc-append-temporary.yml .audit/trainer_ai_c3f_d_doc_trigger.marker
          git diff --cached --check
          git commit -m 'docs(trainer-ai): record C3f-d production readiness components'
          git push origin HEAD:audit/trainer-ai-c3f-d-doc-staging
