name: IA6 W03 V5 - Repel Staging RED/GREEN
on:
  push:
    branches:
      - codex/calvo-items-20261111-w03-repel-staging-v5
    paths:
      - '.github/workflows/ia6-w03-v5-repel-staging.yml'
      - 'tests/gameplay/parallel_items_w03_repel_l3.gd'
      - 'scenes/visual/field_item_bag.gd'
      - 'scenes/visual/field_demo.gd'
      - 'scenes/visual/field_native_bridge.gd'
      - 'modules/overworld/field_repel_step_effect.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ia6-w03-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Prepare canonical resources
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w03-v5-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w03-v5-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee w03-v5-showdown.log
          grep -F 'BATTLE_REFERENCE PASS' w03-v5-showdown.log
      - name: Repel original W03 native + bag + world + SaveV2
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repel_l3.gd 2>&1 | tee w03-v5-repel-l3.log
          grep -E '^CAMP006_W03_REPEL_L3 PASS checks=[1-9][0-9]*$' w03-v5-repel-l3.log
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia6-w03-v5-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: w03-v5-*.log
