name: C3f-ap Freeze 26.64

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1
    paths:
      - .c3fap-freeze-26-64-trigger

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Write and self-clean freeze 26.64
        run: python .github/scripts/c3fap_freeze_26_64.py
