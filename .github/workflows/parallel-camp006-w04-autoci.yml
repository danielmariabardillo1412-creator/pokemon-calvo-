name: CAMP006 W04 - evolucion desde demo y SaveV2 con regresion
on:
  push:
    branches:
      - codex/calvo-items-20261104-w04-camp006
    paths:
      - '.github/workflows/parallel-camp006-w04-autoci.yml'
      - 'tests/tools/test_parallel_items_w04_campaign_006.py'
      - 'tests/gameplay/parallel_items_w04_campaign_006.gd'
      - 'tests/gameplay/parallel_items_w04_condition_resolver.gd'
      - 'tests/gameplay/parallel_items_w04_milcery_resolver.gd'
      - 'tests/fixtures/parallel_items/w04_campaign_006.json'
      - 'docs/coordination/items_parallel_v1/reports/W04/CAMP_006_PROGRESO.csv'
      - 'modules/**'
      - 'scenes/visual/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp006-w04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Puerta de identidad y progreso CAMP006
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261104-w04-camp006"
          python -B - <<'PY'
          import csv, os, json
          from pathlib import Path
          p = list(csv.DictReader(open("docs/coordination/items_parallel_v1/reports/W04/CAMP_006_PROGRESO.csv")))
          f = json.loads(Path("tests/fixtures/parallel_items/w04_campaign_006.json").read_text())
          assert f["worker"] == "W04" and f["campaign"] == "CAMP_006"
          ids = [r["bloque"] for r in p]
          assert len(p) == len(f["blocks"]) == 5 and ids == ["01", "02", "03", "05", "06"], ids
          assert ids == [b["block"] for b in f["blocks"]]
          assert all(r["ids"].split(";") == f["blocks"][i]["ids"] for i, r in enumerate(p))
          assert p[0]["ids"] == "sweet_apple;tart_apple;syrupy_apple"
          assert p[3]["ids"] == "oval_stone;dawn_stone;peat_block"
          assert p[4]["ids"] == "berry_sweet;clover_sweet;flower_sweet;love_sweet;ribbon_sweet;star_sweet;strawberry_sweet"
          assert p[3]["estado"] in ("BLOCKED_PRODUCER_CI_PENDING", "BLOCKED_PRODUCER_VERIFIED")
          assert p[4]["estado"] in ("BLOCKED_SPIN_FORM_PRODUCERS_CI_PENDING", "BLOCKED_SPIN_FORM_PRODUCERS_VERIFIED")
          state = f["execution_state"]
          assert state["last_executed_id"] == "06" and state["deferred"] == ["04"]
          assert state["completed"] == 3 and state["completed_ids"] == ["01", "02", "03"]
          assert state["evaluated_ids"] == ids and state["blocked_ids"] == ["05", "06"]
          assert len(f["deferred_blocks"]) == 1 and f["deferred_blocks"][0]["block"] == "04"
          assert f["blocks"][3]["credited_completion"] is False
          assert f["blocks"][4]["credited_completion"] is False and f["blocks"][4]["block"] == "06"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("completed=3\nlast_executed=06\ndeferred=04\n")
          print("CAMP006_W04_SCOPE PASS completed=3 last_executed=06 deferred=04 rows=5")
          PY
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Preparar recursos e importar Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp006-w04-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp006-w04-import.log; then exit 1; fi
      - name: CAMP006 contrato Python L3 01-03 y condiciones05 no implementadas
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_006.py --ci 2>&1 | tee camp006-w04-python.log
          grep -E "^CAMP006_W04_PY PASS completed=${{ steps.gate.outputs.completed }} last_executed=${{ steps.gate.outputs.last_executed }} deferred=${{ steps.gate.outputs.deferred }} checks=[1-9][0-9]*$" camp006-w04-python.log
      - name: CAMP006 Godot escena real mochila y diagnóstico05 sin crédito de evolución
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_006.gd 2>&1 | tee camp006-w04-godot.log
          grep -E "^CAMP006_W04_GODOT PASS completed=${{ steps.gate.outputs.completed }} last_executed=${{ steps.gate.outputs.last_executed }} deferred=${{ steps.gate.outputs.deferred }} checks=[1-9][0-9]*$" camp006-w04-godot.log
      - name: CAMP006 resolver puro sexo dia luna L2 aislado SIN L3
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_condition_resolver.gd 2>&1 | tee camp006-w04-resolver-l2.log
          grep -E "^CAMP006_W04_CONDITION_RESOLVER cases=4 positives=4 status=PURE_L2_NOT_GAMEPLAY_L3 completed=3 last_executed=06 deferred=04$" camp006-w04-resolver-l2.log
          grep -E "^CAMP006_W04_RESOLVER_L2 PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$" camp006-w04-resolver-l2.log
      - name: CAMP006 Milcery giro y 63 formas resolver puro NO L3
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_milcery_resolver.gd 2>&1 | tee camp006-w04-milcery-l2.log
          grep -E "^CAMP006_W04_MILCERY_RESOLVER sweets=7 canonical_forms=63 pure_precondition_positives=7 status=NOT_L3 completed=3 deferred=04 blocked=05,06$" camp006-w04-milcery-l2.log
          grep -E "^CAMP006_W04_MILCERY_L2 PASS completed=3 last_executed=06 deferred=04 blocked=05,06 checks=[1-9][0-9]*$" camp006-w04-milcery-l2.log
      - name: Detectar cambios de produccion
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(modules/|scenes/visual/)'; then
            echo "modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "modules=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regresion completa CAMP005 al primer bloque y en hitos
        if: steps.gate.outputs.last_executed == '01' || steps.gate.outputs.last_executed == '05' || steps.gate.outputs.last_executed == '06' || steps.gate.outputs.last_executed == '10' || steps.changed.outputs.modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_005.py --ci 2>&1 | tee camp006-w04-camp005-py.log
          grep -E '^CAMP005_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-w04-camp005-py.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_005.gd 2>&1 | tee camp006-w04-camp005-godot.log
          grep -E '^CAMP005_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-w04-camp005-godot.log
      - name: Conservar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp006-w04-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: camp006-w04-*.log
