name: TEMP Trainer AI project book append

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  append-project-book:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[book-appended]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 0

      - name: Apply consolidated Trainer AI checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          dst = Path('docs/project_book/TRAINER_AI.md')
          marker = '## 26. Consolidación C2b–C2e-e'
          current = dst.read_text(encoding='utf-8')
          if marker in current:
              print('Section 26 already present; nothing to append.')
          else:
              source = subprocess.check_output(
                  ['git', 'show', '8062e12352bd12468c50c0fd1083d7add9e7513d:.github/workflows/trainer-ai-book-append-temporary.yml'],
                  text=True,
              )
              start = source.index(marker)
              end = source.index('\nBOOK_EOF', start)
              block = source[start:end].rstrip()
              dst.write_text(current.rstrip() + '\n\n---\n\n' + block + '\n', encoding='utf-8')
          PY

          if git diff --quiet -- docs/project_book/TRAINER_AI.md; then
            echo 'No project book changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md
          git commit -m 'docs(trainer-ai): sync project book through C2e-e [book-appended]'
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
