name: CAMP003 - CI automatica por trabajadora (10 bloques)
on:
  push:
    branches:
      - codex/calvo-items-20261103-w01-camp003
      - codex/calvo-items-20261103-w02-camp003
      - codex/calvo-items-20261103-w03-camp003
      - codex/calvo-items-20261103-w05-camp003
    paths:
      - '.github/workflows/parallel-camp003-worker-autoci.yml'
      - 'tests/tools/test_parallel_items_campaign_003_manifest.py'
      - 'tests/tools/test_parallel_items_*_campaign_003.py'
      - 'tests/gameplay/parallel_items_*_campaign_003.gd'
      - 'tests/fixtures/parallel_items/*_campaign_003.json'
      - 'docs/coordination/items_parallel_v1/reports/*/CAMP_003_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/*/CAMP_003_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp003-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contrato de propiedad y progreso
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-w01-*) W=W01 ;;
            *-w02-*) W=W02 ;;
            *-w03-*) W=W03 ;;
            *-w05-*) W=W05 ;;
            *) echo "Rama no autorizada"; exit 1 ;;
          esac
          echo "worker=$W" >> "$GITHUB_OUTPUT"
          python -B tests/tools/test_parallel_items_campaign_003_manifest.py --worker "$W"
          blocks=$(python -B tests/tools/test_parallel_items_campaign_003_manifest.py --worker "$W" --count-only)
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"
          echo "CAMP003_SCOPE worker=$W blocks=$blocks"
      - name: Bootstrap explicito, NO prueba funcional
        if: steps.scope.outputs.blocks == '0'
        run: echo "BOOTSTRAP_VALIDADO_SIN_NINGUN_BLOQUE_FUNCIONAL"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.blocks != '0'
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        if: steps.scope.outputs.blocks != '0'
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Importar Godot 4.7 y recursos de prueba
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp003-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp003-import.log; then exit 1; fi
          if [ "${{ steps.scope.outputs.worker }}" = W01 ] || [ "${{ steps.scope.outputs.worker }}" = W02 ]; then
            echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
            python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee camp003-native.log
          fi
      - name: Contratos Python por familia y numero exacto de bloques
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          W="${{ steps.scope.outputs.worker }}"
          B="${{ steps.scope.outputs.blocks }}"
          id=$(echo "$W" | tr '[:upper:]' '[:lower:]')
          py="tests/tools/test_parallel_items_${id}_campaign_003.py"
          test -f "$py"
          python -B "$py" --ci 2>&1 | tee camp003-python.log
          python -B tests/tools/test_parallel_items_campaign_003_manifest.py --worker "$W" --verify-output PY --log camp003-python.log
      - name: Contratos Godot por familia y numero exacto de bloques
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          W="${{ steps.scope.outputs.worker }}"
          id=$(echo "$W" | tr '[:upper:]' '[:lower:]')
          gd="tests/gameplay/parallel_items_${id}_campaign_003.gd"
          test -f "$gd"
          timeout 600s godot --headless --path . --script "res://$gd" 2>&1 | tee camp003-godot.log
          python -B tests/tools/test_parallel_items_campaign_003_manifest.py --worker "$W" --verify-output GODOT --log camp003-godot.log
      - name: Prueba de regresion previa (sin atribuir nuevas funciones)
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.scope.outputs.worker }}" in
            W03)
              python -B tests/tools/test_parallel_items_w03_campaign_002.py 2>&1 | tee camp003-old-negative.log
              ;;
            W05)
              python -B -m unittest discover -s tests/tools -p 'test_parallel_items_w05_campaign_002.py' -v 2>&1 | tee camp003-old-mt.log
              ;;
            *) echo "El runner acumulativo nuevo certifica los bloques de esta rama" ;;
          esac
      - name: Publicar evidencia efimera
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp003-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: camp003-*.log
