name: PILOT W05 - bloque nuevo con regresion
on:
  push:
    branches:
      - codex/calvo-items-20261109-w05-books-ui
    paths:
      - '.github/workflows/parallel-w05-books-ui-20261109.yml'
      - 'tests/tools/test_parallel_items_w05_campaign_006_manifest.py'
      - 'docs/coordination/items_parallel_v1/CAMPAIGN_006_W05_QUEUE_APPROVED.csv'
      - 'tests/tools/test_parallel_items_w05_campaign_006.py'
      - 'tests/gameplay/parallel_items_w05_campaign_006.gd'
      - 'tests/fixtures/parallel_items/w05_campaign_006.json'
      - 'tests/tools/test_parallel_items_w05_book_ui_pilot_20261109.py'
      - 'tests/gameplay/parallel_items_w05_book_ui_pilot_20261109.gd'
      - 'tests/tools/test_parallel_items_w05_book_ui_autorun_v1.py'
      - 'tests/gameplay/parallel_items_w05_book_ui_autorun_v1.gd'
      - 'tests/tools/test_parallel_items_w05_book_ui_autorun_v2.py'
      - 'tests/gameplay/parallel_items_w05_book_ui_autorun_v2.gd'
      - 'scenes/visual/field_machine_book_panel.gd'
      - 'tests/tools/test_parallel_items_w05_book_ui_autorun_v3.py'
      - 'tests/gameplay/parallel_items_w05_book_ui_autorun_v3.gd'
      - 'tests/tools/test_parallel_items_w05_book_ui_autorun_v4.py'
      - 'tests/tools/test_parallel_items_w05_book_ui_autorun_v5.py'
      - 'tests/tools/test_parallel_items_w05_continuous_v2.py'
      - 'tests/gameplay/parallel_items_w05_continuous_v2.gd'
      - 'tests/gameplay/parallel_items_w05_export_pck_probe.gd'
      - 'tests/gameplay/parallel_items_w05_export_fallback_probe.gd'
      - 'export_presets.cfg'
      - 'docs/coordination/items_parallel_v1/reports/W05/AUTORUN_V5_PROGRESS.csv'
      - 'tests/gameplay/parallel_items_w05_book_ui_autorun_v4.gd'
      - 'data/localization/machine_moves_es_sv_v1.json'
      - 'docs/coordination/items_parallel_v1/reports/W05/AUTORUN_V4_PROGRESS.csv'
      - 'docs/coordination/items_parallel_v1/reports/W05/AUTORUN_V3_PROGRESS.csv'
      - 'tests/fixtures/parallel_items/w05_book_ui_autorun_v2.json'
      - 'docs/coordination/items_parallel_v1/reports/W05/AUTORUN_V2_PROGRESS.csv'
      - 'docs/coordination/items_parallel_v1/reports/W05/AUTORUN_V1_PROGRESS.csv'
      - 'modules/**'
      - 'docs/coordination/items_parallel_v1/reports/W05/CAMP_006_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/W05/CAMP_006_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilot-w05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identidad, reserva y progreso CAMP006
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261109-w05-books-ui"
          python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py
          N=$(python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py --count-only)
          echo "blocks=$N" >> "$GITHUB_OUTPUT"
      - name: Bootstrap 0 de 10, no funcional
        if: steps.scope.outputs.blocks == '0'
        run: echo "BOOTSTRAP_CAMP006_W05_NO_FUNCIONAL 0/10"

      - uses: chickensoft-games/setup-godot@v2.4.1
        if: steps.scope.outputs.blocks != '0'
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Preparar Godot 4.7 y fuentes canónicas
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp006-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp006-import.log; then exit 1; fi

      - name: Pruebas Python CAMP006 con recibo de bloque
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/tools/test_parallel_items_w05_campaign_006.py
          python -B tests/tools/test_parallel_items_w05_campaign_006.py --ci 2>&1 | tee camp006-python.log
          python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py --verify-output PY --log camp006-python.log
      - name: Pruebas Godot CAMP006 con recibo de bloque
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/gameplay/parallel_items_w05_campaign_006.gd
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_006.gd 2>&1 | tee camp006-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py --verify-output GODOT --log camp006-godot.log
      - name: Detectar parche de producción propio
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -q '^modules/'; then
            echo "modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "modules=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regresión CAMP005 CAMP004 CAMP003 en hitos y parches propios
        if: steps.scope.outputs.blocks == '1' || steps.scope.outputs.blocks == '5' || steps.scope.outputs.blocks == '10' || steps.changed.outputs.modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_campaign_005.py --ci 2>&1 | tee camp006-regression-camp005-py.log
          grep -E '^CAMP005_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp005-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_005.gd 2>&1 | tee camp006-regression-camp005-godot.log
          grep -E '^CAMP005_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp005-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_004.py --ci 2>&1 | tee camp006-regression-camp004-py.log
          grep -E '^CAMP004_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp004-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_004.gd 2>&1 | tee camp006-regression-camp004-godot.log
          grep -E '^CAMP004_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp004-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_003.py --ci 2>&1 | tee camp006-regression-camp003-py.log
          grep -E '^CAMP003_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp003-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_003.gd 2>&1 | tee camp006-regression-camp003-godot.log
          grep -E '^CAMP003_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp003-godot.log
      - name: Nuevo piloto de integración W05 con pruebas independientes
        shell: bash
        run: |
          set -euo pipefail
          PY="tests/tools/test_parallel_items_w05_book_ui_pilot_20261109.py"
          GD="tests/gameplay/parallel_items_w05_book_ui_pilot_20261109.gd"
          if [ ! -e "$PY" ] && [ ! -e "$GD" ]; then
            echo "W05_BOOK_UI_PILOT_20261109 BOOTSTRAP_ONLY (piloto aun no implementado)"
          else
            test -f "$PY"
            test -f "$GD"
            python -B "$PY" 2>&1 | tee w05-pilot-python.log
            grep -E '^W05_BOOK_UI_PILOT_20261109_PY PASS checks=[1-9][0-9]*$' w05-pilot-python.log
            timeout 900s godot --headless --path . --script "res://$GD" 2>&1 | tee w05-pilot-godot.log
            grep -E '^W05_BOOK_UI_PILOT_20261109_GODOT PASS checks=[1-9][0-9]*$' w05-pilot-godot.log
          fi
      - name: AUTORUN V1 W05 - diez grupos 49 libros con UI real
        if: steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_book_ui_autorun_v1.py 2>&1 | tee w05-autorun-python.log
          grep -E '^W05_BOOKS_AUTORUN_PY PASS blocks=10 ids=49 checks=[1-9][0-9]*$' w05-autorun-python.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_book_ui_autorun_v1.gd 2>&1 | tee w05-autorun-godot.log
          grep -E '^W05_BOOKS_AUTORUN_GODOT PASS blocks=10 ids=49 functional=[0-9]+ blocked=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-godot.log
          test "$(grep -Ec '^W05_BOOKS_AUTORUN_GROUP block=[0-9]{2} status=(CERTIFICABLE|BLOQUEADO) ids=[45] functional=[0-9]+ blocked=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-godot.log)" -eq 10
      - name: AUTORUN V2 W05 - diez grupos 180 libros desde panel real
        if: steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_book_ui_autorun_v2.py 2>&1 | tee w05-autorun-v2-python.log
          grep -E '^W05_BOOKS_AUTORUN_V2_PY PASS blocks=10 ids=180 total_active=229 previous=49 checks=[1-9][0-9]*$' w05-autorun-v2-python.log
          timeout 1000s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_book_ui_autorun_v2.gd 2>&1 | tee w05-autorun-v2-godot.log
          grep -E '^W05_BOOKS_AUTORUN_V2_GODOT PASS blocks=10 ids=180 functional=[0-9]+ blocked=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-v2-godot.log
          test "$(grep -Ec '^W05_BOOKS_AUTORUN_V2_GROUP block=[0-9]{2} status=(CERTIFICABLE|BLOQUEADO) ids=18 functional=[0-9]+ blocked=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-v2-godot.log)" -eq 10
      - name: AUTORUN V3 W05 - 10 gates de robustez de panel 229 libros
        if: steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_book_ui_autorun_v3.py 2>&1 | tee w05-autorun-v3-python.log
          grep -E '^W05_BOOKS_AUTORUN_V3_PY PASS blocks=10 books=229 checks=[1-9][0-9]*$' w05-autorun-v3-python.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_book_ui_autorun_v3.gd 2>&1 | tee w05-autorun-v3-godot.log
          grep -E '^W05_BOOKS_AUTORUN_V3_GODOT PASS blocks=10 functional=10 blocked=0 checks=[1-9][0-9]*$' w05-autorun-v3-godot.log
          test "$(grep -Ec '^W05_BOOKS_AUTORUN_V3_HIT block=[0-9]{2} name=[A-Za-z0-9_]+ status=CERTIFICABLE checks=[1-9][0-9]*$' w05-autorun-v3-godot.log)" -eq 10
      - name: AUTORUN V4 W05 - 229 nombres ES PokeAPI con UI y regresiones
        if: steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_book_ui_autorun_v4.py 2>&1 | tee w05-autorun-v4-python.log
          grep -E '^W05_BOOKS_AUTORUN_V4_PY PASS groups=10 ids=229 translated=229 missing=0 mismatches=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-v4-python.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_book_ui_autorun_v4.gd 2>&1 | tee w05-autorun-v4-godot.log
          grep -E '^W05_BOOKS_AUTORUN_V4_GODOT PASS groups=10 translated=229 missing=0 checks=[1-9][0-9]*$' w05-autorun-v4-godot.log
          test "$(grep -Ec '^W05_BOOKS_AUTORUN_V4_GROUP block=[0-9]{2} status=CERTIFICABLE ids=(23|22) translated=(23|22) missing=0 checks=[1-9][0-9]*$' w05-autorun-v4-godot.log)" -eq 10
      - name: CONTINUOUS V2 - B01 B03 real-panel rehearsal and IA6 contract
        if: steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_continuous_v2.py 2>&1 | tee w05-continuous-v2-contract.log
          grep -E '^W05_V2_CONTRACT PASS books=229 source_es=229 teach_entrypoints=1 historical_regressions=preserved real_mount=(pending_ia6|present_unverified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp006-w05-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            camp006-*.log
            w05-continuous-v2-*.log

  v5-export-audit:
    name: W05 TANDA05 - Windows PCK/runtime isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TANDA05 Python - 229 Spanish labels and portable export contract
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_book_ui_autorun_v5.py | tee w05-v5-preflight.log
          grep -E '^W05_BOOKS_AUTORUN_V5_PY PASS rows=229 portable=1 original_sources=229 pck_inclusion=UNVERIFIED$' w05-v5-preflight.log
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true
      - name: Godot isolated fallback without JSON and with invalid schema
        shell: bash
        run: |
          set -euo pipefail
          FB="$RUNNER_TEMP/w05-fallback-only-project"
          mkdir -p "$FB/modules/localization" "$FB/data/localization"
          printf '[application]\nconfig/name="W05 Fallback Isolated Probe"\n' > "$FB/project.godot"
          cp modules/localization/machine_moves_es_sv_w05.gd "$FB/modules/localization/"
          cp tests/gameplay/parallel_items_w05_export_fallback_probe.gd "$FB/probe.gd"
          godot --headless --path "$FB" --script "$FB/probe.gd" -- missing 2>&1 | tee w05-v5-fallback-missing.log
          grep -E '^W05_V5_FALLBACK PASS mode=missing verified=false source=fallback$' w05-v5-fallback-missing.log
          printf '{"schema_version":2,"locale":"es","entries":{}}\n' > "$FB/data/localization/machine_moves_es_sv_v1.json"
          godot --headless --path "$FB" --script "$FB/probe.gd" -- invalid 2>&1 | tee w05-v5-fallback-invalid.log
          grep -E '^W05_V5_FALLBACK PASS mode=invalid verified=false source=fallback$' w05-v5-fallback-invalid.log
      - name: Windows PCK export without touching existing build artifacts
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w05-v5-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w05-v5-import.log; then exit 1; fi
          PCK="$RUNNER_TEMP/w05-tanda05-windows-probe.pck"
          if godot --headless --path . --export-pack "Pokemon Calvo Technical Test Windows" "$PCK" 2>&1 | tee w05-v5-export.log; then
            test -s "$PCK"
            echo "W05_V5_WINDOWS_EXPORT PASS output=temp_pck"
          else
            if grep -Ei 'export template(s)? (are )?(missing|not found|unavailable)|no export template|export templates? not installed' w05-v5-export.log; then
              echo "W05_V5_WINDOWS_EXPORT BLOCKED reason=windows_export_templates"
              exit 0
            fi
            echo "W05_V5_WINDOWS_EXPORT FAIL reason=unexpected_export_error"
            exit 1
          fi
          PROBE="$RUNNER_TEMP/w05-pck-only-project"
          mkdir -p "$PROBE"
          printf '[application]\nconfig/name="W05 PCK Isolation Probe"\n' > "$PROBE/project.godot"
          cp tests/gameplay/parallel_items_w05_export_pck_probe.gd "$PROBE/probe.gd"
          godot --headless --path "$PROBE" --script "$PROBE/probe.gd" -- "$PCK" 2>&1 | tee w05-v5-runtime.log
          grep -E '^W05_V5_PCK_PROBE PASS records=229 runtime_samples=4 helper=1 source=pck_only$' w05-v5-runtime.log
          EXE="$RUNNER_TEMP/W05-PokemonCalvo-Windows-Export-Probe.exe"
          godot --headless --path . --export-release "Pokemon Calvo Technical Test Windows" "$EXE" 2>&1 | tee w05-v5-exe-export.log
          python -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); head=p.open("rb").read(2); size=p.stat().st_size; assert head==b"MZ" and size>1000000; print(f"W05_V5_WINDOWS_EXE PASS header=MZ size={size}")' "$EXE" | tee w05-v5-exe-check.log
          grep -E '^W05_V5_WINDOWS_EXE PASS header=MZ size=[1-9][0-9]+
      - name: Save TANDA05 diagnostic logs, not distributables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-v5-audit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            w05-v5-*.log
            w05-v2-budget.log
 w05-continuous-v2-contract.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_continuous_v2.gd 2>&1 | tee w05-continuous-v2-godot.log
          grep -E '^W05_V2_CONSUMER_GODOT PASS live_service=1 real_panel=1 accepted=1 duplicate_spend=0 storage_rejection=1 locked_rollback=1 savev2=1 actual_bag=NOT_MOUNTED w03_coexistence=IA6_PENDING checks=[1-9][0-9]*
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp006-w05-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: camp006-*.log

