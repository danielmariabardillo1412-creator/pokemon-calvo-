name: PILOT W05 - bloque nuevo con regresion
on:
  push:
    branches:
      - codex/calvo-items-20261109-w05-books-ui
    paths:
      - '.github/workflows/parallel-w05-books-ui-20261109.yml'
      - 'tests/tools/test_parallel_items_w05_campaign_006_manifest.py'
      - 'docs/coordination/items_parallel_v1/CAMPAIGN_006_W05_QUEUE_APPROVED.csv'
      - 'tests/tools/test_parallel_items_w05_campaign_006.py'
      - 'tests/gameplay/parallel_items_w05_campaign_006.gd'
      - 'tests/fixtures/parallel_items/w05_campaign_006.json'
      - 'tests/tools/test_parallel_items_w05_book_ui_pilot_20261109.py'
      - 'tests/gameplay/parallel_items_w05_book_ui_pilot_20261109.gd'
      - 'tests/tools/test_parallel_items_w05_book_ui_autorun_v1.py'
      - 'tests/gameplay/parallel_items_w05_book_ui_autorun_v1.gd'
      - 'docs/coordination/items_parallel_v1/reports/W05/AUTORUN_V1_PROGRESS.csv'
      - 'modules/**'
      - 'docs/coordination/items_parallel_v1/reports/W05/CAMP_006_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/W05/CAMP_006_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilot-w05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identidad, reserva y progreso CAMP006
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261109-w05-books-ui"
          python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py
          N=$(python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py --count-only)
          echo "blocks=$N" >> "$GITHUB_OUTPUT"
      - name: Bootstrap 0 de 10, no funcional
        if: steps.scope.outputs.blocks == '0'
        run: echo "BOOTSTRAP_CAMP006_W05_NO_FUNCIONAL 0/10"

      - uses: chickensoft-games/setup-godot@v2.4.1
        if: steps.scope.outputs.blocks != '0'
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Preparar Godot 4.7 y fuentes canónicas
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp006-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp006-import.log; then exit 1; fi

      - name: Pruebas Python CAMP006 con recibo de bloque
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/tools/test_parallel_items_w05_campaign_006.py
          python -B tests/tools/test_parallel_items_w05_campaign_006.py --ci 2>&1 | tee camp006-python.log
          python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py --verify-output PY --log camp006-python.log
      - name: Pruebas Godot CAMP006 con recibo de bloque
        if: steps.scope.outputs.blocks != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/gameplay/parallel_items_w05_campaign_006.gd
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_006.gd 2>&1 | tee camp006-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_006_manifest.py --verify-output GODOT --log camp006-godot.log
      - name: Detectar parche de producción propio
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -q '^modules/'; then
            echo "modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "modules=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regresión CAMP005 CAMP004 CAMP003 en hitos y parches propios
        if: steps.scope.outputs.blocks == '1' || steps.scope.outputs.blocks == '5' || steps.scope.outputs.blocks == '10' || steps.changed.outputs.modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_campaign_005.py --ci 2>&1 | tee camp006-regression-camp005-py.log
          grep -E '^CAMP005_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp005-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_005.gd 2>&1 | tee camp006-regression-camp005-godot.log
          grep -E '^CAMP005_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp005-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_004.py --ci 2>&1 | tee camp006-regression-camp004-py.log
          grep -E '^CAMP004_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp004-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_004.gd 2>&1 | tee camp006-regression-camp004-godot.log
          grep -E '^CAMP004_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp004-godot.log
          python -B tests/tools/test_parallel_items_w05_campaign_003.py --ci 2>&1 | tee camp006-regression-camp003-py.log
          grep -E '^CAMP003_W05_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp003-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_campaign_003.gd 2>&1 | tee camp006-regression-camp003-godot.log
          grep -E '^CAMP003_W05_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-regression-camp003-godot.log
      - name: Nuevo piloto de integración W05 con pruebas independientes
        shell: bash
        run: |
          set -euo pipefail
          PY="tests/tools/test_parallel_items_w05_book_ui_pilot_20261109.py"
          GD="tests/gameplay/parallel_items_w05_book_ui_pilot_20261109.gd"
          if [ ! -e "$PY" ] && [ ! -e "$GD" ]; then
            echo "W05_BOOK_UI_PILOT_20261109 BOOTSTRAP_ONLY (piloto aun no implementado)"
          else
            test -f "$PY"
            test -f "$GD"
            python -B "$PY" 2>&1 | tee w05-pilot-python.log
            grep -E '^W05_BOOK_UI_PILOT_20261109_PY PASS checks=[1-9][0-9]*$' w05-pilot-python.log
            timeout 900s godot --headless --path . --script "res://$GD" 2>&1 | tee w05-pilot-godot.log
            grep -E '^W05_BOOK_UI_PILOT_20261109_GODOT PASS checks=[1-9][0-9]*$' w05-pilot-godot.log
          fi
      - name: AUTORUN V1 W05 - diez grupos 49 libros con UI real
        if: steps.scope.outputs.blocks == '10'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w05_book_ui_autorun_v1.py 2>&1 | tee w05-autorun-python.log
          grep -E '^W05_BOOKS_AUTORUN_PY PASS blocks=10 ids=49 checks=[1-9][0-9]*$' w05-autorun-python.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w05_book_ui_autorun_v1.gd 2>&1 | tee w05-autorun-godot.log
          grep -E '^W05_BOOKS_AUTORUN_GODOT PASS blocks=10 ids=49 functional=[0-9]+ blocked=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-godot.log
          test "$(grep -Ec '^W05_BOOKS_AUTORUN_GROUP block=[0-9]{2} status=(CERTIFICABLE|BLOQUEADO) ids=[45] functional=[0-9]+ blocked=[0-9]+ checks=[1-9][0-9]*$' w05-autorun-godot.log)" -eq 10
      - name: Conservar evidencia 7 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp006-w05-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: camp006-*.log
