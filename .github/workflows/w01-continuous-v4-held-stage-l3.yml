name: W01 CONTINUOUS_V4 actual held FieldItemService L3 staging
on:
  push:
    branches:
      - codex/calvo-ia6-staging-20261111-w01-held
    paths:
      - '.github/workflows/w01-continuous-v4-held-stage-l3.yml'
      - 'tests/gameplay/w01_continuous_v4_stage_held_l3.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held_stage_l3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore resources and native Showdown
        shell: bash
        run: |
          set -euo pipefail
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w01-v4-stage-l3-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w01-v4-stage-l3-import.log; then exit 1; fi
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee w01-v4-stage-l3-native.log
      - name: Actual inventory, native battle, settlement and SaveV2 across ten modes
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s godot --headless --path . --script res://tests/gameplay/w01_continuous_v4_stage_held_l3.gd 2>&1 | tee w01-v4-stage-l3.log
          grep -E '^W01_V4_STAGE_L3 PASS modes=10 checks=[1-9][0-9]*$' w01-v4-stage-l3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w01-v4-stage-l3-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w01-v4-stage-l3*.log
