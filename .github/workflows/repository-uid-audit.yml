name: Repository Godot UID Audit

on:
  push:
    branches:
      - chore/repository-organization-v1
    paths:
      - '.github/workflows/repository-uid-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-organization-v1
          fetch-depth: 0

      - name: Verify Godot script UID sidecars
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          gd = sorted(p for p in tracked if p.endswith('.gd'))
          uids = sorted(p for p in tracked if p.endswith('.gd.uid'))
          uid_set = set(uids)
          gd_set = set(gd)

          missing = [p for p in gd if p + '.uid' not in uid_set]
          orphan = [p for p in uids if p[:-4] not in gd_set]

          print(f'tracked_gd={len(gd)}')
          print(f'tracked_gd_uid={len(uids)}')
          print(f'missing_uid={len(missing)}')
          print(f'orphan_uid={len(orphan)}')
          if missing:
              print('MISSING:')
              print('\n'.join(missing))
          if orphan:
              print('ORPHAN:')
              print('\n'.join(orphan))
          if missing or orphan:
              raise SystemExit(1)
          PY
