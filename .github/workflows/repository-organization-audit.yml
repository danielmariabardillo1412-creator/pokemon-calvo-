name: Repository Organization Audit

on:
  push:
    branches:
      - chore/repository-organization-v1
    paths:
      - '.github/workflows/repository-organization-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-organization-v1
          fetch-depth: 0

      - name: Audit repository references and layout
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== AUDIT HEAD ==='
            git rev-parse HEAD
            echo
            echo '=== TOP LEVEL ==='
            du -sh .github ci core data docs modules scenes tests tools 2>/dev/null || true
            echo
            echo '=== TRACKED FILE COUNTS ==='
            for d in .github ci core data docs modules scenes tests tools; do
              printf '%-10s ' "$d"
              git ls-files "$d" | wc -l
            done
            echo
            echo '=== CANONICAL res://data REFERENCES ==='
            git grep -h -o -E 'res://data/[A-Za-z0-9_./-]+' -- '*.gd' '*.tscn' '*.tres' '*.md' '*.yml' '*.yaml' 2>/dev/null | sort -u || true
            echo
            echo '=== OLD ADAPTER REFERENCES ==='
            git grep -n -F 'pokeapi_adapter.py' -- ':!tools/pokeapi_adapter.py' ':!.github/workflows/repository-organization-audit.yml' || true
            echo
            echo '=== V3 ADAPTER REFERENCES ==='
            git grep -n -F 'pokeapi_adapter_v3.py' -- ':!tools/pokeapi_adapter_v3.py' ':!.github/workflows/repository-organization-audit.yml' || true
            echo
            echo '=== CANDIDATE LEGACY DATA DIRECTORY REFERENCES ==='
            for p in data/species data/moves data/types data/statuses data/battle; do
              echo "--- $p ---"
              git grep -n -F "$p/" -- ':!.github/workflows/repository-organization-audit.yml' ":!$p/**" || true
              git grep -n -F "res://$p/" -- ':!.github/workflows/repository-organization-audit.yml' ":!$p/**" || true
            done
            echo
            echo '=== FOUNDATION FIXTURE REFERENCES ==='
            git grep -n -F 'data/fixtures/starter_dataset.json' -- ':!.github/workflows/repository-organization-audit.yml' || true
            git grep -n -F 'data/manifests/starter_manifest.json' -- ':!.github/workflows/repository-organization-audit.yml' || true
            echo
            echo '=== RUNTIME COVERAGE V2 REFERENCES ==='
            git grep -n -F 'runtime_coverage_v2.json' -- ':!.github/workflows/repository-organization-audit.yml' || true
            echo
            echo '=== README / STATUS STALE MARKERS ==='
            git grep -n -E '131 PASS|foundation/core-v1|pokeapi_adapter.py|986 especies|937 movimientos|129390' -- README.md docs || true
            echo
            echo '=== DOC INVENTORY ==='
            find docs -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo '=== PHASE REPORT COUNT ==='
            find docs -maxdepth 1 -type f -name 'INFORME_FINAL_*' | wc -l
            echo
            echo '=== WORKFLOW INVENTORY ==='
            find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo '=== TEST RUNNER INVENTORY ==='
            find tests -maxdepth 1 -type f \( -name '*runner*.gd' -o -name '*test_suite*.gd' \) -printf '%f\n' | sort
          } | tee repository_audit_tmp.txt

      - name: Commit temporary audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repository_audit_tmp.txt
          git commit -m 'chore(repo): capture temporary audit report'
          git push origin HEAD:chore/repository-organization-v1
