name: IA6 - W02 Berry Diagnostic (Godot 4.7)
on:
  push:
    branches: [codex/calvo-items-20261101-ci-w02-diagnostico]
    paths: ['.github/workflows/w02-campaign-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Prepare native engine and project
        shell: bash
        run: |
          set -euo pipefail
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/distribution/restore_resources.py
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import >w02-import.log 2>&1
          python -B tools/battle_reference/run.py --install --limit 1 >w02-native.log 2>&1
      - name: Inspect current W02 failures - no assertion weakened
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w02_campaign_001.py --unittest 2>&1 | tee w02-unit.log
          timeout 340s godot --headless --path . --script res://tests/gameplay/parallel_items_w02_campaign_001.gd 2>&1 | tee w02-diagnose.log
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w02-diagnostic-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w02-*.log
