name: Trainer AI freeze 26.61 writer

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  append-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 5

      - name: Verify certified state and staged freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~3)" = "40aa9d6ad0dea70bd9cc9dd6e5872251b9904d8b"
          test "$(git rev-parse HEAD:docs/project_book/TRAINER_AI.md)" = "7567345a6dd6643691b7582cd54167218a2efeb3"
          test "$(git rev-parse HEAD:modules/gameplay/trainer_battle_session.gd)" = "dd25cf551360f36dc9e65aa445f60f5c1ee5e55e"
          test -f docs/project_book/.trainer_ai_freeze_26_61.tmp.md
          grep -Fx '## 26.61 — Freeze C3f-am: API autónomo side_b explícito doblemente certificado; lifecycle completo pasa a auditoría' docs/project_book/.trainer_ai_freeze_26_61.tmp.md
          test "$(grep -c '^## 26\.61 ' docs/project_book/TRAINER_AI.md || true)" -eq 0

      - name: Append freeze and self-clean
        shell: bash
        run: |
          set -euo pipefail
          NOTEBOOK='docs/project_book/TRAINER_AI.md'
          STAGED='docs/project_book/.trainer_ai_freeze_26_61.tmp.md'
          cat "$STAGED" >> "$NOTEBOOK"
          test "$(grep -c '^## 26\.61 ' "$NOTEBOOK")" -eq 1
          rm "$STAGED"
          rm .github/workflows/trainer-ai-freeze-26-61-writer.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -Fx 'docs/project_book/TRAINER_AI.md'
          git diff --cached --name-only | grep -Fx 'docs/project_book/.trainer_ai_freeze_26_61.tmp.md'
          git diff --cached --name-only | grep -Fx '.github/workflows/trainer-ai-freeze-26-61-writer.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(trainer-ai): freeze 26.61 C3f-am autonomous side-b submission API'
          git push origin "HEAD:${GITHUB_REF_NAME}"
