name: IA3 W03 V7 - isolated classic flute mechanics (not L3)
on:
  push:
    branches:
      - codex/calvo-items-20261112-w03-black-white-flutes-v7
    paths:
      - '.github/workflows/ia6-w03-v7-flutes-unit.yml'
      - 'modules/overworld/field_flute_encounter_rate_v7.gd'
      - 'tests/gameplay/parallel_items_w03_flute_rate_v7.gd'
      - 'scenes/visual/field_demo.gd'
      - 'scenes/visual/field_item_bag.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated_flute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore resources and compile
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee v7-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' v7-import.log; then exit 1; fi
      - name: Isolated flute table rate validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_flute_rate_v7.gd 2>&1 | tee v7-unit.log
          grep -F 'W03_FLUTE_V7_UNIT checks=20 failures=0' v7-unit.log
          if grep -E 'W03_FLUTE_V7 FAIL|SCRIPT ERROR|Parse Error' v7-unit.log; then exit 1; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-v7-flute-unit-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            v7-import.log
            v7-unit.log
