name: Temporary Trainer AI C3f-am staging

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-am-stage
    paths:
      - .github/workflows/trainer-ai-c3f-am-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-am-stage

      - name: Wire autonomous side-b API and runner
        shell: bash
        run: |
          set -euo pipefail
          python3 .trainer_ai_c3fam_patch.py
          rm .trainer_ai_c3fam_patch.py
          rm .github/workflows/trainer-ai-c3f-am-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gameplay/trainer_battle_session.gd tests/trainer_ai/trainer_evaluation_corpus_test_runner.gd .trainer_ai_c3fam_patch.py .github/workflows/trainer-ai-c3f-am-stage.yml
          git commit -m 'feat(trainer-ai): stage C3f-am autonomous side-b API'
          git push origin HEAD:tmp/trainer-ai-c3f-am-stage
