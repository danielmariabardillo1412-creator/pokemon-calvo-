name: W04 AUTORUN V2 - regional form producer and legacy SaveV2
on:
  push:
    branches:
      - codex/calvo-items-20261104-w04-camp006
    paths:
      - '.github/workflows/parallel-w04-autorun-v2.yml'
      - 'docs/coordination/items_parallel_v1/reports/W04/AUTORUN_V2_PROGRESS.csv'
      - 'tests/tools/test_w04_autorun_v2_form_identity.py'
      - 'tests/gameplay/w04_autorun_v2_form_identity.gd'
      - 'modules/creatures/progression/canonical_form_identity_w04.gd'
      - 'modules/creatures/progression/creature_factory.gd'
      - 'modules/creatures/domain/creature_instance.gd'
      - 'modules/save/save_game_data.gd'
      - 'modules/save/field_native_save.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w04-autorun-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate canonical source and optional SaveV2 form
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261104-w04-camp006"
          python -B tests/tools/test_w04_autorun_v2_form_identity.py 2>&1 | tee w04-v2-source-python.log
          grep -E '^W04_AUTORUN_V2_PY PASS checks=[1-9][0-9]* source=real_slowpoke_galar expected_form=slowpoke-galar$' w04-v2-source-python.log
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore original canonical resources and import Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04-v2-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04-v2-import.log; then exit 1; fi
      - name: Real regional encounter factory Party Storage SaveV2 native positive and corruption negative
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/w04_autorun_v2_form_identity.gd 2>&1 | tee w04-v2-pilot-godot.log
          grep -E '^W04_AUTORUN_V2_FORM_PILOT scope=canonical_slowpoke_galar producer=real_encounter form=slowpoke-galar savev2=2 gameplay_form_change=false$' w04-v2-pilot-godot.log
          grep -E '^W04_AUTORUN_V2_FORM PASS checks=[1-9][0-9]*$' w04-v2-pilot-godot.log
      - name: W04 preserved CAMP006 and pure resolver checks
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_006.py --ci 2>&1 | tee w04-v2-c006-py.log
          grep -E '^CAMP006_W04_PY PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$' w04-v2-c006-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_006.gd 2>&1 | tee w04-v2-c006-godot.log
          grep -E '^CAMP006_W04_GODOT PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$' w04-v2-c006-godot.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_condition_resolver.gd 2>&1 | tee w04-v2-resolver-l2.log
          grep -E '^CAMP006_W04_RESOLVER_L2 PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$' w04-v2-resolver-l2.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_milcery_resolver.gd 2>&1 | tee w04-v2-milcery-l2.log
          grep -E '^CAMP006_W04_MILCERY_L2 PASS completed=3 last_executed=06 deferred=04 blocked=05,06 checks=[1-9][0-9]*$' w04-v2-milcery-l2.log
      - name: CAMP005 frozen history full regression
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_005.py --ci 2>&1 | tee w04-v2-c005-py.log
          grep -E '^CAMP005_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04-v2-c005-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_005.gd 2>&1 | tee w04-v2-c005-godot.log
          grep -E '^CAMP005_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04-v2-c005-godot.log
      - name: CAMP004 preserved regression
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_004.py --ci 2>&1 | tee w04-v2-c004-py.log
          grep -E '^CAMP004_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04-v2-c004-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_004.gd 2>&1 | tee w04-v2-c004-godot.log
          grep -E '^CAMP004_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04-v2-c004-godot.log
      - name: CAMP003 preserved regression
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_003.py --ci 2>&1 | tee w04-v2-c003-py.log
          grep -E '^CAMP003_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04-v2-c003-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_003.gd 2>&1 | tee w04-v2-c003-godot.log
          grep -E '^CAMP003_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04-v2-c003-godot.log
      - name: Preserve W04 V2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-autorun-v2-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w04-v2-*.log
