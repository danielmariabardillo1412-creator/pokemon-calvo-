name: TEMP Trainer AI C2e-g book checkpoint recovery 2

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  checkpoint-project-book-recovery2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 0
      - name: Append checkpoint normalize EOF and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64,gzip,pathlib; src=pathlib.Path(".github/workflows/trainer-ai-c2eg-book-checkpoint-recovery-temporary.yml").read_text(); token=next(line.split(":",1)[1].strip() for line in src.splitlines() if line.strip().startswith("SECTION_GZ_B64:")); p=pathlib.Path("docs/project_book/TRAINER_AI.md"); s=gzip.decompress(base64.b64decode(token)).decode("utf-8"); t=p.read_text(); out=t if "### 26.14 C2e-g" in t else t.rstrip()+"\n\n"+s; p.write_text(out.rstrip()+"\n")'
          rm -f .github/workflows/trainer-ai-c2eg-book-checkpoint-temporary.yml
          rm -f .github/workflows/trainer-ai-c2eg-book-checkpoint-recovery-temporary.yml
          rm -f .github/workflows/trainer-ai-c2eg-book-checkpoint-recovery2-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/project_book/TRAINER_AI.md .github/workflows
          git diff --cached --check
          git commit -m "docs(trainer-ai): close C2e-g guarded support production"
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
