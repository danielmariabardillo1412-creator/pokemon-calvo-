name: CAMP006 W03 - integration pilot with prior regression
on:
  push:
    branches:
      - codex/calvo-items-20261104-w03-camp006
    paths:
      - '.github/workflows/parallel-camp006-w03-autoci.yml'
      - 'tests/tools/test_parallel_items_w03_campaign_006.py'
      - 'tests/gameplay/parallel_items_w03_campaign_006.gd'
      - 'tests/fixtures/parallel_items/w03_campaign_006.json'
      - 'modules/overworld/escape_rope_demo_pilot.gd'
      - 'modules/overworld/field_repel_step_effect.gd'
      - 'modules/overworld/field_world_item_transaction.gd'
      - 'scenes/visual/field_item_bag.gd'
      - 'scenes/visual/field_demo.gd'
      - 'scenes/visual/field_native_bridge.gd'
      - 'tests/gameplay/parallel_items_w03_repel_l3.gd'
      - 'docs/coordination/items_parallel_v1/reports/W03/CAMP_006_PROGRESO.csv'
      - 'docs/coordination/items_parallel_v1/reports/W03/CAMP_006_APLAZADOS.csv'
      - 'tests/tools/test_parallel_items_w03_block05_source_red.py'
      - 'tests/tools/test_parallel_items_w03_autorun_v1.py'
      - 'tests/gameplay/parallel_items_w03_repeat_history_v2.gd'
      - 'tests/gameplay/parallel_items_w03_repeat_native_v3.gd'
      - 'tests/gameplay/parallel_items_w03_repeat_native_v4.gd'
      - 'tests/gameplay/parallel_items_w03_repeat_native_v4_negatives.gd'
      - 'tests/gameplay/parallel_items_w03_repeat_native_v4_transform.gd'
      - 'modules/gameplay/showdown_adventure_session.gd'
      - 'docs/coordination/items_parallel_v1/reports/W03/AUTORUN_V3_PROGRESS.csv'
      - 'modules/capture/caught_species_history_w03.gd'
      - 'modules/capture/capture_context_ball_effects.gd'
      - 'modules/capture/capture_battle_context.gd'
      - 'modules/creatures/storage/player_collection.gd'
      - 'modules/save/save_game_data.gd'
      - 'modules/save/save_game_repository.gd'
      - 'modules/save/load_result.gd'
      - 'modules/save/field_native_save.gd'
      - 'modules/gameplay/wild_adventure_session.gd'
      - 'tests/tools/test_parallel_items_w03_campaign_005.py'
      - 'docs/coordination/items_parallel_v1/reports/W03/AUTORUN_V1_PROGRESS.csv'
      - 'docs/coordination/items_parallel_v1/reports/W03/AUTORUN_V1_PRODUCER_BLOCKERS.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp006-w03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restore canonical resources and Godot import
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp006-w03-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp006-w03-import.log; then exit 1; fi
      - name: CAMP006 Python pilot
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w03_campaign_006.py --ci 2>&1 | tee camp006-w03-python.log
          grep -E '^CAMP006_W03_PY PASS blocks=3 checks=[1-9][0-9]* deferred=1 last_executed_id=03$' camp006-w03-python.log
      - name: Block05 authenticated origin contract (expected RED until IA6 seam)
        shell: bash
        run: |
          set -euo pipefail
          if python -B tests/tools/test_parallel_items_w03_block05_source_red.py >camp006-w03-block05-source.log 2>&1; then
            echo 'Unexpected source contract success; inspect integration and activate actual positive tests' >&2
            exit 1
          fi
          grep -F 'RED: no authenticated encounter origin' camp006-w03-block05-source.log
          echo 'BLOCK05_DEPENDENCY confirmed; NOT a functional PASS'
      - name: CAMP006 Godot demo and SaveV2 pilot
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_campaign_006.gd 2>&1 | tee camp006-w03-godot.log
          grep -E '^CAMP006_W03_GODOT PASS blocks=3 checks=[1-9][0-9]*$' camp006-w03-godot.log
      - name: CAMP006 W03 repel L3 native field integration
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repel_l3.gd 2>&1 | tee camp006-w03-repel-l3.log
          grep -E '^CAMP006_W03_REPEL_L3 PASS checks=[1-9][0-9]*$' camp006-w03-repel-l3.log
      - name: Mandatory CAMP005 W03 regression
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w03_campaign_005.py --ci 2>&1 | tee camp006-w03-camp005-py.log
          grep -E '^CAMP005_W03_PY PASS blocks=10 checks=[1-9][0-9]*$' camp006-w03-camp005-py.log
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_campaign_005.gd 2>&1 | tee camp006-w03-camp005-godot.log
          grep -E '^CAMP005_W03_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp006-w03-camp005-godot.log
      - name: W03 AUTORUN V1 real-source and existing effects audit
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w03_autorun_v1.py 2>&1 | tee camp006-w03-autorun-v1.log
          grep -E '^W03_AUTORUN_V1_PY PASS examined=10 existing_functional_rows=1 new_functional=0 checks=[1-9][0-9]*$' camp006-w03-autorun-v1.log
      - name: W03 AUTORUN V2 Repeat Ball live ledger and SaveV2 test
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repeat_history_v2.gd 2>&1 | tee camp006-w03-repeat-v2.log
          grep -E '^W03_REPEAT_V2_GODOT PASS checks=[1-9][0-9]* native_capture_l3=false$' camp006-w03-repeat-v2.log
      - name: SaveV2 collection compatibility
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/savegame_v2_test_runner.gd 2>&1 | tee camp006-w03-savev2.log
          grep -E '^=== SAVEGAME V2 TEST RESULT: [1-9][0-9]* PASS / 0 FAIL ===$' camp006-w03-savev2.log
      - name: SaveV2 hostile payload regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/savegame_v2_adversarial_test_runner.gd 2>&1 | tee camp006-w03-savev2-adversarial.log
          grep -E '^=== SAVEGAME V2 ADVERSARIAL RESULT: [1-9][0-9]* PASS / 0 FAIL ===$' camp006-w03-savev2-adversarial.log
      - name: Install pinned native simulation for real field battle tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee camp006-w03-native-bootstrap.log
          grep -F 'BATTLE_REFERENCE PASS' camp006-w03-native-bootstrap.log
      - name: Native field SaveV2 and capture regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/field_native_test_runner.gd 2>&1 | tee camp006-w03-native-field.log
          grep -E '^FIELD_NATIVE .*PASS' camp006-w03-native-field.log
      - name: W03 AUTORUN V3 real native Repeat capture history
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repeat_native_v3.gd 2>&1 | tee camp006-w03-repeat-native-v3.log
          grep -E '^W03_REPEAT_NATIVE_V3 PASS checks=[1-9][0-9]*$' camp006-w03-repeat-native-v3.log
      - name: W03 AUTORUN V4 native Repeat full-party and checkpoint QA
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repeat_native_v4.gd 2>&1 | tee camp006-w03-repeat-native-v4.log
          grep -E '^W03_REPEAT_NATIVE_V4 PASS checks=[1-9][0-9]*$' camp006-w03-repeat-native-v4.log
      - name: W03 TANDA04 native failed RNG and ledger SaveV2 QA
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repeat_native_v4_negatives.gd 2>&1 | tee camp006-w03-repeat-native-v4-neg.log
          grep -E '^W03_REPEAT_NATIVE_V4_NEG PASS checks=[1-9][0-9]*$' camp006-w03-repeat-native-v4-neg.log
      - name: W03 TANDA04 native Transform and distinct Repeat QA
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_repeat_native_v4_transform.gd 2>&1 | tee camp006-w03-repeat-native-v4-transform.log
          grep -E '^W03_REPEAT_NATIVE_V4_TRANSFORM PASS checks=[1-9][0-9]*$' camp006-w03-repeat-native-v4-transform.log
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp006-w03-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: camp006-w03-*.log
