name: IA6 CAMP002 ITER02 independent W01 W02 W03 gate
on:
  push:
    branches: [codex/calvo-items-20261102-ci-camp002-iter02]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ia6-camp002-iter02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and native simulator
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee ia6-iter02-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' ia6-iter02-import.log; then exit 1; fi
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee ia6-iter02-native.log
      - name: W01 equipment 7 cases 10 native runs 30 variants
        id: w01
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_campaign_002.py --contracts 2>&1 | tee ia6-iter02-w01-contract.log
          python -B tests/tools/test_parallel_items_w01_campaign_002.py --self-test 2>&1 | tee ia6-iter02-w01-self.log
          timeout 360s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_campaign_002.gd 2>&1 | tee ia6-iter02-w01-godot.log
          grep -E 'W01_CAMP002_GODOT PASS' ia6-iter02-w01-godot.log
          python -B tests/tools/test_parallel_items_w01_campaign_002.py --native 2>&1 | tee ia6-iter02-w01-receipt.log
      - name: W02 four berries 9 cases native and receipt validation
        id: w02
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w02_campaign_002.py --fixture-only 2>&1 | tee ia6-iter02-w02-fixture.log
          python -B tests/tools/test_parallel_items_w02_campaign_002.py --unittest 2>&1 | tee ia6-iter02-w02-unittest.log
          timeout 420s godot --headless --path . --script res://tests/gameplay/parallel_items_w02_campaign_002.gd 2>&1 | tee ia6-iter02-w02-godot.log
          grep -E 'PARALLEL_ITEMS_W02_CAMP002 PASS' ia6-iter02-w02-godot.log
          python -B tests/tools/test_parallel_items_w02_campaign_002.py --result .godot/parallel_items/w02_campaign_002/godot.json 2>&1 | tee ia6-iter02-w02-receipt.log
      - name: W03 Dusk Repeat Dive negative capture contract
        id: w03
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w03_campaign_002.py 2>&1 | tee ia6-iter02-w03-static.log
          timeout 180s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_campaign_002.gd 2>&1 | tee ia6-iter02-w03-godot.log
          grep -E 'CAMP_002_W03_NEGATIVE.*"status":"PASS"' ia6-iter02-w03-godot.log
      - name: Independent verdict — no false green
        if: always()
        shell: bash
        env:
          W01: ${{ steps.w01.outcome }}
          W02: ${{ steps.w02.outcome }}
          W03: ${{ steps.w03.outcome }}
        run: |
          set -euo pipefail
          echo "W01=$W01 W02=$W02 W03=$W03"
          test "$W01" = success && test "$W02" = success && test "$W03" = success
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia6-camp002-iter02-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: ia6-iter02-*.log
