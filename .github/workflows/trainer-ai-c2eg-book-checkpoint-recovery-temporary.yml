name: TEMP Trainer AI C2e-g book checkpoint recovery

on:
  push:
    branches:
      - audit/trainer-ai-v3-random-cup-redesign-v1

permissions:
  contents: write

jobs:
  checkpoint-project-book-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SECTION_GZ_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-v3-random-cup-redesign-v1
          fetch-depth: 0
      - name: Append checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os,base64,gzip,pathlib; p=pathlib.Path("docs/project_book/TRAINER_AI.md"); s=gzip.decompress(base64.b64decode(os.environ["SECTION_GZ_B64"])).decode("utf-8"); t=p.read_text(); p.write_text(t if "### 26.14 C2e-g" in t else t.rstrip()+"\n\n"+s+"\n")'
          rm -f .github/workflows/trainer-ai-c2eg-book-checkpoint-temporary.yml
          rm -f .github/workflows/trainer-ai-c2eg-book-checkpoint-recovery-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/project_book/TRAINER_AI.md .github/workflows
          git diff --cached --check
          git commit -m "docs(trainer-ai): close C2e-g guarded support production"
          git push origin HEAD:audit/trainer-ai-v3-random-cup-redesign-v1
