name: Temporary Trainer AI C3f-ak OFF Path Fix

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-ak-off-path-fix
    paths:
      - .github/workflows/trainer-ai-c3f-ak-off-path-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-ak-off-path-fix

      - name: Restore exact OFF-path submit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/gameplay/trainer_battle_session.gd')
          s = p.read_text()
          old = '\tvar events := _battle_server.submit_turn([player_action, authoritative_opponent_action])\n'
          new = '''\tvar events: Array[BattleEvent] = []\n\tif _trainer_action_substitution_enabled:\n\t\tevents = _battle_server.submit_turn([player_action, authoritative_opponent_action])\n\telse:\n\t\tevents = _battle_server.submit_turn([player_action, opponent_action])\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -F '_battle_server.submit_turn([player_action, opponent_action])' modules/gameplay/trainer_battle_session.gd
          grep -F '_battle_server.submit_turn([player_action, authoritative_opponent_action])' modules/gameplay/trainer_battle_session.gd
          rm .github/workflows/trainer-ai-c3f-ak-off-path-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gameplay/trainer_battle_session.gd .github/workflows/trainer-ai-c3f-ak-off-path-fix.yml
          git commit -m 'fix(trainer-ai): preserve exact C3f-ak OFF submit path'
          git push origin HEAD:tmp/trainer-ai-c3f-ak-off-path-fix
