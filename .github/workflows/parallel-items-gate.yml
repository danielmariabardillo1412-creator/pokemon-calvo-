name: Parallel Items - Single Family Gate
on:
  push:
    branches:
      - codex/calvo-items-20261101-arbitro
    paths:
      - '.github/workflows/parallel-items-gate.yml'
      - 'tests/gameplay/parallel_items_*'
      - 'tests/tools/test_parallel_items_*'
      - 'tests/tools/test_parallel_w05_machine_scope.py'
      - 'tools/item_audit/parallel_w05_machine_scope.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-items-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Five item families (Godot 4.7 + Python)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Verify tools and pinned Python contracts
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --version | grep -E '^4[.]7([.-]|$)'
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tests/tools/test_parallel_items_w01_held_v1.py --contracts
          python -B tests/tools/test_parallel_items_w02_berries_v1.py --unittest
          python -B tests/tools/test_parallel_items_w03_capture_v1.py
          python -B tests/tools/test_parallel_items_w04_evolution_v1.py
          python -B -m unittest discover -s tests/tools -p 'test_parallel_w05_machine_scope.py' -v
          python -B tools/item_audit/parallel_w05_machine_scope.py
      - name: Prepare exact repository assets and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee parallel-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' parallel-import.log; then exit 1; fi
      - name: Restore pinned native simulator (0.10.11)
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee parallel-native.log
      - name: W01 - three held combat items
        id: w01
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_held_v1.gd 2>&1 | tee parallel-w01.log
          python -B tests/tools/test_parallel_items_w01_held_v1.py 2>&1 | tee parallel-w01-validate.log
      - name: W02 - berry consumption
        id: w02
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s godot --headless --path . --script res://tests/gameplay/parallel_items_w02_berries_v1.gd 2>&1 | tee parallel-w02.log
          python -B tests/tools/test_parallel_items_w02_berries_v1.py --result .godot/parallel_items/w02_berries_v1/godot.json 2>&1 | tee parallel-w02-validate.log
      - name: W03 - capture characterization only
        id: w03
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://tests/gameplay/parallel_items_w03_capture_net_v1.gd 2>&1 | tee parallel-w03.log
          grep -E 'W03_CAPTURE_NET' parallel-w03.log
          # The test must NOT claim Net Ball is connected when it is absent.
      - name: W04 - three evolution paths
        id: w04
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 220s python -B tests/tools/test_parallel_items_w04_evolution_v1.py --godot godot 2>&1 | tee parallel-w04.log

      - name: Consolidated family verdict (no false green on a failed family)
        if: always()
        shell: bash
        env:
          FAMILY_W01: ${{ steps.w01.outcome }}
          FAMILY_W02: ${{ steps.w02.outcome }}
          FAMILY_W03: ${{ steps.w03.outcome }}
          FAMILY_W04: ${{ steps.w04.outcome }}
        run: |
          set -euo pipefail
          bad=0
          for w in W01 W02 W03 W04; do
            key="FAMILY_${w}"
            status="${!key}"
            echo "${w}: ${status}"
            if [ "${status}" != success ]; then bad=1; fi
          done
          if [ "${bad}" -ne 0 ]; then
            echo 'One or more item families failed; inspect each family log.'
            exit 1
          fi
      - name: Preserve bounded failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-items-evidence-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            parallel-*.log
            .godot/parallel_items/w01_held_v1/report.json
            .godot/parallel_items/w02_berries_v1/godot.json
