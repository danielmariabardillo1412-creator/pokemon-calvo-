name: Godot 4.7 Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot headless regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Stage pinned PokeAPI report fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in (
              Path('data/reports/forms_policy_report.json'),
              Path('data/reports/unsupported_mechanics.json'),
              Path('data/reports/import_summary.json'),
          ):
              with p.open(encoding='utf-8') as f:
                  json.load(f)
              print(f'CI fixture ready: {p}')
          PY

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee godot-import.log

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee godot-test.log
          summary="$(grep -E '=== PROJECT TEST RESULT: [0-9]+ PASS / 0 FAIL ===' godot-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 470 ]; then
            echo "Regression: expected at least 470 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "CI regression baseline satisfied: $pass_count PASS / 0 FAIL"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs-${{ github.run_id }}
          path: |
            godot-version.log
            godot-import.log
            godot-test.log
          if-no-files-found: ignore
          retention-days: 7
