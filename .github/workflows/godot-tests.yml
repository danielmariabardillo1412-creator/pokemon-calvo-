name: Godot 4.7 Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot headless regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Stage pinned PokeAPI report fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in (
              Path('data/reports/forms_policy_report.json'),
              Path('data/reports/unsupported_mechanics.json'),
              Path('data/reports/import_summary.json'),
          ):
              with p.open(encoding='utf-8') as f:
                  json.load(f)
              print(f'CI fixture ready: {p}')
          PY

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee godot-import.log

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee godot-test.log
          summary="$(grep -E '=== PROJECT TEST RESULT: [0-9]+ PASS / 0 FAIL ===' godot-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 470 ]; then
            echo "Regression: expected at least 470 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "CI regression baseline satisfied: $pass_count PASS / 0 FAIL"

      - name: Run inventory phase suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/inventory_test_runner.gd 2>&1 | tee inventory-test.log
          summary="$(grep -E '=== INVENTORY TEST RESULT: [0-9]+ PASS / 0 FAIL ===' inventory-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 47 ]; then
            echo "Inventory regression: expected at least 47 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Inventory phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run savegame V2 phase suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/savegame_v2_test_runner.gd 2>&1 | tee savegame-v2-test.log
          summary="$(grep -E '=== SAVEGAME V2 TEST RESULT: [0-9]+ PASS / 0 FAIL ===' savegame-v2-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 40 ]; then
            echo "Savegame V2 regression: expected at least 40 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Savegame V2 phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run savegame V2 adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 10s godot --headless --path . --script res://tests/savegame_v2_adversarial_test_runner.gd 2>&1 | tee savegame-v2-adversarial.log
          summary="$(grep -E '=== SAVEGAME V2 ADVERSARIAL RESULT: [0-9]+ PASS / 0 FAIL ===' savegame-v2-adversarial.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 8 ]; then
            echo "Savegame V2 adversarial regression: expected at least 8 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Savegame V2 adversarial gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run wild encounter phase suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/wild_encounter_test_runner.gd 2>&1 | tee wild-encounter-test.log
          summary="$(grep -E '=== WILD ENCOUNTER TEST RESULT: [0-9]+ PASS / 0 FAIL ===' wild-encounter-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 54 ]; then
            echo "Wild encounter regression: expected at least 54 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Wild encounter phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run logical vertical slice suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/vertical_slice_test_runner.gd 2>&1 | tee vertical-slice-test.log
          summary="$(grep -E '=== VERTICAL SLICE TEST RESULT: [0-9]+ PASS / 0 FAIL ===' vertical-slice-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 62 ]; then
            echo "Vertical slice regression: expected at least 62 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Vertical slice phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run overworld phase suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/overworld_test_runner.gd 2>&1 | tee overworld-test.log
          summary="$(grep -E '=== OVERWORLD TEST RESULT: [0-9]+ PASS / 0 FAIL ===' overworld-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 59 ]; then
            echo "Overworld regression: expected at least 59 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Overworld phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run battle presentation phase suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/battle_presentation_test_runner.gd 2>&1 | tee battle-presentation-test.log
          summary="$(grep -E '=== BATTLE PRESENTATION TEST RESULT: [0-9]+ PASS / 0 FAIL ===' battle-presentation-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 35 ]; then
            echo "Battle presentation regression: expected at least 35 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Battle presentation phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run battle commands phase suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/battle_commands_test_runner.gd 2>&1 | tee battle-commands-test.log
          summary="$(grep -E '=== BATTLE COMMANDS TEST RESULT: [0-9]+ PASS / 0 FAIL ===' battle-commands-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 53 ]; then
            echo "Battle commands regression: expected at least 53 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Battle commands phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run battle capture presentation suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/battle_capture_presentation_test_runner.gd 2>&1 | tee battle-capture-presentation-test.log
          summary="$(grep -E '=== BATTLE CAPTURE PRESENTATION RESULT: [0-9]+ PASS / 0 FAIL ===' battle-capture-presentation-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 68 ]; then
            echo "Battle capture presentation regression: expected at least 68 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Battle capture presentation phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Run battle switch presentation suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/battle_switch_presentation_test_runner.gd 2>&1 | tee battle-switch-presentation-test.log
          summary="$(grep -E '=== BATTLE SWITCH PRESENTATION RESULT: [0-9]+ PASS / 0 FAIL ===' battle-switch-presentation-test.log | tail -n 1)"
          test -n "$summary"
          pass_count="$(printf '%s\n' "$summary" | sed -E 's/.*RESULT: ([0-9]+) PASS.*/\1/')"
          if [ "$pass_count" -lt 35 ]; then
            echo "Battle switch presentation regression: expected at least 35 passing checks, got $pass_count" >&2
            exit 1
          fi
          echo "Battle switch presentation phase gate satisfied: $pass_count PASS / 0 FAIL"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs-${{ github.run_id }}
          path: |
            godot-version.log
            godot-import.log
            godot-test.log
            inventory-test.log
            savegame-v2-test.log
            savegame-v2-adversarial.log
            wild-encounter-test.log
            vertical-slice-test.log
            overworld-test.log
            battle-presentation-test.log
            battle-commands-test.log
            battle-capture-presentation-test.log
            battle-switch-presentation-test.log
          if-no-files-found: ignore
          retention-days: 7
