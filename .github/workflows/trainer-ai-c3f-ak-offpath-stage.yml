name: Temporary Trainer AI C3f-ak OFF path staging

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-ak-stage
    paths:
      - .github/workflows/trainer-ai-c3f-ak-offpath-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-ak-stage

      - name: Apply C3f-ak explicit OFF path fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp_c3fak_offpath_fix.py
          rm .tmp_c3fak_offpath_fix.py
          rm .github/workflows/trainer-ai-c3f-ak-offpath-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gameplay/trainer_battle_session.gd .tmp_c3fak_offpath_fix.py .github/workflows/trainer-ai-c3f-ak-offpath-stage.yml
          git commit -m 'fix(trainer-ai): preserve explicit OFF submit path in C3f-ak'
          git push origin HEAD:tmp/trainer-ai-c3f-ak-stage
