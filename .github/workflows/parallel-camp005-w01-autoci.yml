name: CAMP005 W01 - equipables reales y regresion CAMP004
on:
  push:
    branches:
      - codex/calvo-items-20261104-w01-camp005
    paths:
      - '.github/workflows/parallel-camp005-w01-autoci.yml'
      - 'tests/tools/test_parallel_items_w01_campaign_005.py'
      - 'tests/tools/repro_w01_camp005_b06_transform.cjs'
      - 'tests/gameplay/parallel_items_w01_campaign_005.gd'
      - 'tests/fixtures/parallel_items/w01_campaign_005.json'
      - 'docs/coordination/items_parallel_v1/reports/W01/CAMP_005_PROGRESO.csv'
      - 'modules/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp005-w01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identidad y progreso W01 CAMP005
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261104-w01-camp005"
          python -B - <<'PY'
          import csv, os
          q = list(csv.DictReader(open("docs/coordination/items_parallel_v1/CAMPAIGN_005_W01_QUEUE_APPROVED.csv")))
          p = list(csv.DictReader(open("docs/coordination/items_parallel_v1/reports/W01/CAMP_005_PROGRESO.csv")))
          assert len(q) == 10 and 1 <= len(p) <= 10
          assert all(q[i]["trabajadora"] == "W01" and q[i]["bloque"] == f"{i+1:02d}" for i in range(10))
          assert all(x["bloque"] == q[i]["bloque"] and x["ids"] == q[i]["ids"] for i,x in enumerate(p))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"blocks={len(p)}\n")
          print(f"CAMP005_W01_SCOPE PASS blocks={len(p)}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Restaurar recursos canonicos, importar y preparar motor
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee camp005-w01-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' camp005-w01-import.log; then exit 1; fi
          echo "POKEMON_CALVO_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python -B tools/battle_reference/run.py --install --limit 1 2>&1 | tee camp005-w01-native.log
      - name: W01 B06 aislado native Transform snapshot y switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/tools/repro_w01_camp005_b06_transform.cjs 2>&1 | tee camp005-w01-native-transform.log
          grep -E '^W01_B06_NATIVE_REPRO PASS cases=3 snapshots=3 switches=3$' camp005-w01-native-transform.log
      - name: CAMP005 Python equipables
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_campaign_005.py --ci 2>&1 | tee camp005-w01-python.log
          grep -E "^CAMP005_W01_PY PASS blocks=${{ steps.gate.outputs.blocks }} checks=[1-9][0-9]*$" camp005-w01-python.log
      - name: CAMP005 Godot portador tipo dano y SaveV2
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_campaign_005.gd 2>&1 | tee camp005-w01-godot.log
          grep -E "^CAMP005_W01_GODOT PASS blocks=${{ steps.gate.outputs.blocks }} checks=[1-9][0-9]*$" camp005-w01-godot.log
      - name: Deteccion cambios de produccion
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -q '^modules/'; then
            echo "modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "modules=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regresion CAMP004 completa obligatoria al inicio y en hitos
        if: steps.gate.outputs.blocks == '1' || steps.gate.outputs.blocks == '5' || steps.gate.outputs.blocks == '10' || steps.changed.outputs.modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w01_campaign_004.py --ci 2>&1 | tee camp005-w01-regression-camp004-py.log
          grep -E '^CAMP004_W01_PY PASS blocks=10 checks=[1-9][0-9]*$' camp005-w01-regression-camp004-py.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w01_campaign_004.gd 2>&1 | tee camp005-w01-regression-camp004-godot.log
          grep -E '^CAMP004_W01_GODOT PASS blocks=10 checks=[1-9][0-9]*$' camp005-w01-regression-camp004-godot.log
      - name: Conservar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp005-w01-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: camp005-w01-*.log
