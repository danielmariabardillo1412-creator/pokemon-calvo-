name: W04 AUTORUN V1 - 10 rows / preserved QA and regressions
on:
  push:
    branches:
      - codex/calvo-items-20261104-w04-camp006
    paths:
      - '.github/workflows/parallel-w04-autorun-v1.yml'
      - 'docs/coordination/items_parallel_v1/reports/W04/AUTORUN_V1_PROGRESS.csv'
      - 'docs/coordination/items_parallel_v1/reports/W04/AUTORUN_V1_MATRIX.json'
      - 'docs/coordination/items_parallel_v1/reports/W04/AUTORUN_V1_SHARED_PRODUCER_TICKET.md'
      - 'tests/tools/test_parallel_items_w04_autorun_v1.py'
      - 'tests/gameplay/parallel_items_w04_*.gd'
      - 'tests/tools/test_parallel_items_w04_campaign_*.py'
      - 'tests/fixtures/parallel_items/w04_campaign_*.json'
      - 'modules/creatures/progression/**'
      - 'modules/creatures/domain/**'
      - 'modules/inventory/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w04-autorun-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: W04 AUTORUN 10 rows canonical producer matrix and immutable history
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/calvo-items-20261104-w04-camp006"
          python -B tests/tools/test_parallel_items_w04_autorun_v1.py --ci 2>&1 | tee w04-autorun-v1-scope.log
          grep -E '^W04_AUTORUN_V1_PY PASS rows=10 ids=18 routes=23 completed_historical=3 qa_functional=[0-2] checks=[1-9][0-9]*$' w04-autorun-v1-scope.log
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Godot restore and resources import
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep -E '^4[.]7([.-]|$)'
          python -B tools/distribution/restore_resources.py
          python -B tools/distribution/restore_resources.py --check
          mkdir -p data/reports
          cp ci/fixtures/pokeapi_reports/forms_policy_report.json data/reports/forms_policy_report.json
          cp ci/fixtures/pokeapi_reports/unsupported_mechanics.json data/reports/unsupported_mechanics.json
          cp ci/fixtures/pokeapi_reports/import_summary.json data/reports/import_summary.json
          godot --headless --path . --import 2>&1 | tee w04-autorun-v1-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' w04-autorun-v1-import.log; then exit 1; fi
      - name: CAMP006 Python and Godot actual bag regression
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_006.py --ci 2>&1 | tee w04-autorun-v1-c006-py.log
          grep -E '^CAMP006_W04_PY PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$' w04-autorun-v1-c006-py.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_006.gd 2>&1 | tee w04-autorun-v1-c006-godot.log
          grep -E '^CAMP006_W04_GODOT PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$' w04-autorun-v1-c006-godot.log
      - name: W04 evolution conditions L2 only
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_condition_resolver.gd 2>&1 | tee w04-autorun-v1-conditions-l2.log
          grep -E '^CAMP006_W04_RESOLVER_L2 PASS completed=3 last_executed=06 deferred=04 checks=[1-9][0-9]*$' w04-autorun-v1-conditions-l2.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_milcery_resolver.gd 2>&1 | tee w04-autorun-v1-milcery-l2.log
          grep -E '^CAMP006_W04_MILCERY_L2 PASS completed=3 last_executed=06 deferred=04 blocked=05,06 checks=[1-9][0-9]*$' w04-autorun-v1-milcery-l2.log
      - name: CAMP005 full historic regression Python and Godot
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_005.py --ci 2>&1 | tee w04-autorun-v1-c005-py.log
          grep -E '^CAMP005_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04-autorun-v1-c005-py.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_005.gd 2>&1 | tee w04-autorun-v1-c005-godot.log
          grep -E '^CAMP005_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04-autorun-v1-c005-godot.log
      - name: CAMP004 older regression Python and Godot
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_004.py --ci 2>&1 | tee w04-autorun-v1-c004-py.log
          grep -E '^CAMP004_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04-autorun-v1-c004-py.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_004.gd 2>&1 | tee w04-autorun-v1-c004-godot.log
          grep -E '^CAMP004_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04-autorun-v1-c004-godot.log
      - name: CAMP003 older regression Python and Godot
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/tools/test_parallel_items_w04_campaign_003.py --ci 2>&1 | tee w04-autorun-v1-c003-py.log
          grep -E '^CAMP003_W04_PY PASS blocks=10 checks=[1-9][0-9]*$' w04-autorun-v1-c003-py.log
          timeout 1100s godot --headless --path . --script res://tests/gameplay/parallel_items_w04_campaign_003.gd 2>&1 | tee w04-autorun-v1-c003-godot.log
          grep -E '^CAMP003_W04_GODOT PASS blocks=10 checks=[1-9][0-9]*$' w04-autorun-v1-c003-godot.log
      - name: Keep AUTORUN and historical logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-autorun-v1-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: w04-autorun-v1-*.log
