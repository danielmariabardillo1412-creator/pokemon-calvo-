name: Temporary Trainer AI C3f-ak audit Variant staging

on:
  push:
    branches:
      - tmp/trainer-ai-c3f-ak-stage
    paths:
      - .github/workflows/trainer-ai-c3f-ak-audit-variant-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-c3f-ak-stage
      - name: Apply C3f-ak audit Variant typing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp_c3fak_audit_variant_fix.py
          rm .tmp_c3fak_audit_variant_fix.py
          rm .github/workflows/trainer-ai-c3f-ak-audit-variant-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/trainer_ai/trainer_battle_session_authoritative_substitution_audit_test_suite.gd .tmp_c3fak_audit_variant_fix.py .github/workflows/trainer-ai-c3f-ak-audit-variant-stage.yml
          git commit -m 'fix(trainer-ai): type C3f-ak audit Variants explicitly'
          git push origin HEAD:tmp/trainer-ai-c3f-ak-stage
