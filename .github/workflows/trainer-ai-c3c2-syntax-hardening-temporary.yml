name: TEMP Trainer AI C3c2 syntax hardening

on:
  push:
    branches:
      - audit/trainer-ai-c3c2-structural-sensitivity-staging

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3c2-structural-sensitivity-staging
      - name: Harden strict Godot constructs and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/trainer_ai/trainer_roster_structural_formula_sensitivity_test_suite.gd')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\t\t\tif not scores_by_weight.has(weight_key):\n\t\t\t\t\t\tscores_by_weight[weight_key] = {}\n\t\t\t\t\t(scores_by_weight[weight_key] as Dictionary)[String(spec.get("cap_profile_id", ""))] = score'''
          new = '''\t\t\t\t\tif not scores_by_weight.has(weight_key):\n\t\t\t\t\t\tscores_by_weight[weight_key] = {}\n\t\t\t\t\tvar weight_scores: Dictionary = scores_by_weight[weight_key] as Dictionary\n\t\t\t\t\tweight_scores[String(spec.get("cap_profile_id", ""))] = score\n\t\t\t\t\tscores_by_weight[weight_key] = weight_scores'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''\tvar low: int = scores.min()\n\tvar high: int = scores.max()\n\treturn low >= roundi(7000.0 * 0.80) and high <= 10000 and high - low <= 1500'''
          new = '''\tvar low: int = 10000\n\tvar high: int = 0\n\tfor score in scores:\n\t\tlow = mini(low, score)\n\t\thigh = maxi(high, score)\n\treturn low >= roundi(7000.0 * 0.80) and high <= 10000 and high - low <= 1500'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/trainer-ai-c3c2-syntax-hardening-temporary.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/trainer_ai/trainer_roster_structural_formula_sensitivity_test_suite.gd .github/workflows/trainer-ai-c3c2-syntax-hardening-temporary.yml
          git commit -m 'test(trainer-ai): harden C3c2 strict Godot syntax'
          git push origin HEAD:audit/trainer-ai-c3c2-structural-sensitivity-staging
