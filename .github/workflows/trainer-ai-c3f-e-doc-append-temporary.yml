name: TEMP Trainer AI C3f-e notebook append

on:
  push:
    branches:
      - audit/trainer-ai-c3f-e-doc-staging

permissions:
  contents: write

jobs:
  append-c3f-e-doc:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'trigger C3f-e notebook append')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3f-e-doc-staging
      - name: Append C3f-e checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/trainer_ai_c3f_e_production_real_data_audit.md >> docs/project_book/TRAINER_AI.md
          rm .audit/trainer_ai_c3f_e_production_real_data_audit.md
          rm .github/workflows/trainer-ai-c3f-e-doc-append-temporary.yml
          rm .audit/trainer_ai_c3f_e_doc_trigger.marker
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md .audit/trainer_ai_c3f_e_production_real_data_audit.md .github/workflows/trainer-ai-c3f-e-doc-append-temporary.yml .audit/trainer_ai_c3f_e_doc_trigger.marker
          git diff --cached --check
          git commit -m 'docs(trainer-ai): record C3f-e production real-data audit'
          git push origin HEAD:audit/trainer-ai-c3f-e-doc-staging
