name: TEMP Trainer AI C3c2 notebook append

on:
  push:
    branches:
      - audit/trainer-ai-c3c2-doc-staging

permissions:
  contents: write

jobs:
  append-c3c2-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trainer-ai-c3c2-doc-staging
      - name: Append C3c2 checkpoint and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cat docs/project_book/_C3C2_APPEND_TEMP.md >> docs/project_book/TRAINER_AI.md
          rm docs/project_book/_C3C2_APPEND_TEMP.md
          rm .github/workflows/trainer-ai-c3c2-doc-append-temporary.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md docs/project_book/_C3C2_APPEND_TEMP.md .github/workflows/trainer-ai-c3c2-doc-append-temporary.yml
          git commit -m 'docs(trainer-ai): record C3c2 sensitivity selection'
          git push origin HEAD:audit/trainer-ai-c3c2-doc-staging
