name: Temporary Trainer AI 26.59 append

on:
  push:
    branches:
      - tmp/trainer-ai-2659-append
    paths:
      - .github/workflows/trainer-ai-2659-append.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/trainer-ai-2659-append

      - name: Append 26.59 and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' >> docs/project_book/TRAINER_AI.md
          cat ci/tmp/trainer-ai-2659-freeze.md >> docs/project_book/TRAINER_AI.md
          rm ci/tmp/trainer-ai-2659-freeze.md
          rm .github/workflows/trainer-ai-2659-append.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project_book/TRAINER_AI.md ci/tmp/trainer-ai-2659-freeze.md .github/workflows/trainer-ai-2659-append.yml
          git commit -m 'docs(trainer-ai): append freeze 26.59'
          git push origin HEAD:tmp/trainer-ai-2659-append