name: Pokemon Calvo Technical Test Windows Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Smoke test packaged technical build and export Windows EXE
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Stamp exact build and canonical data identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          DATA_SHA="$(sha256sum data/normalized/pokemon_api.json | awk '{print $1}')"
          export SOURCE_SHA DATA_SHA
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "source_sha": os.environ["SOURCE_SHA"],
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "build_kind": os.environ.get("GITHUB_EVENT_NAME", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "data_sha256": os.environ["DATA_SHA"],
          }
          Path("data/build_metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY
          grep -F "\"source_sha\": \"${SOURCE_SHA}\"" data/build_metadata.json
          grep -F "\"data_sha256\": \"${DATA_SHA}\"" data/build_metadata.json

      - name: Guard full real-project export contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'export_filter="all_resources"' export_presets.cfg
          grep -F 'data/normalized/pokemon_api.json' export_presets.cfg
          grep -F 'data/build_metadata.json' export_presets.cfg
          test -s data/normalized/pokemon_api.json
          test -s data/build_metadata.json

      - name: Setup Godot 4.7 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee godot-version.log
          godot --version | grep -E '^4\.7([\.-]|$)'

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee technical-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' technical-import.log; then
            echo 'Project import found a script/parse error.' >&2
            exit 1
          fi

      - name: Smoke test canonical technical world in source checkout
        shell: bash
        run: |
          set -euo pipefail
          timeout 25s godot --headless --path . --quit-after 5 2>&1 | tee technical-source-smoke.log
          grep -E 'TECHNICAL_TEST_READY species=[1-9][0-9]* moves=[1-9][0-9]* reports=' technical-source-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Cannot get class|Could not find' technical-source-smoke.log; then
            echo 'Technical source smoke test found a runtime error.' >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          REPORT_DIR="$(sed -n 's/^.*reports=\(.*\)$/\1/p' technical-source-smoke.log | tail -n 1)"
          test -n "$REPORT_DIR"
          test -d "$REPORT_DIR"
          SOURCE_SESSION="$(ls -1t "$REPORT_DIR"/session_*.jsonl | head -n 1)"
          grep -F "\"source_sha\":\"${SOURCE_SHA}\"" "$SOURCE_SESSION"
          rm -rf "$REPORT_DIR"

      - name: Export and run isolated verification PCK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-pack "Pokemon Calvo Technical Test Windows" build/technical-test-verify.pck 2>&1 | tee technical-pack-export.log
          test -s build/technical-test-verify.pck
          timeout 35s godot --headless --main-pack build/technical-test-verify.pck --quit-after 5 2>&1 | tee technical-packed-smoke.log
          grep -E 'TECHNICAL_TEST_READY species=[1-9][0-9]* moves=[1-9][0-9]* reports=' technical-packed-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Cannot get class|Could not find' technical-packed-smoke.log; then
            echo 'EXPORTED TECHNICAL PACKAGE IS NOT SELF-CONTAINED.' >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          REPORT_DIR="$(sed -n 's/^.*reports=\(.*\)$/\1/p' technical-packed-smoke.log | tail -n 1)"
          test -n "$REPORT_DIR"
          test -d "$REPORT_DIR"
          PACKED_SESSION="$(ls -1t "$REPORT_DIR"/session_*.jsonl | head -n 1)"
          grep -F "\"source_sha\":\"${SOURCE_SHA}\"" "$PACKED_SESSION"
          rm -f build/technical-test-verify.pck

      - name: Export single-file Windows technical build
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Pokemon Calvo Technical Test Windows" build/PokemonCalvo-Pruebas-Tecnicas.exe 2>&1 | tee technical-export.log
          test -s build/PokemonCalvo-Pruebas-Tecnicas.exe
          if [ -e build/PokemonCalvo-Pruebas-Tecnicas.pck ]; then
            echo 'Unexpected external PCK: export must remain a single executable.' >&2
            exit 1
          fi
          ls -lh build/PokemonCalvo-Pruebas-Tecnicas.exe

      - name: Upload Windows technical test build
        uses: actions/upload-artifact@v4
        with:
          name: PokemonCalvo-Pruebas-Tecnicas-Windows
          path: build/PokemonCalvo-Pruebas-Tecnicas.exe
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
